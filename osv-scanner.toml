reason = "Informational 'unmaintained' advisory for the paste crate. paste 1.0.15 is a stale Cargo.lock entry: no package in the workspace dependency graph references it (cargo tree -i paste is empty), so there is nothing to replace."

# gtk-rs 0.18 family (gtk/atk/gdk/glib/proc-macro-error) — Linux-only
# transitive deps of the `tray-icon` crate's Linux backend, recorded in the
# workspace Cargo.lock because Cargo resolves all target-specific deps. sharecli
# ships a separate native Linux tray (`sharecli-tray-linux`) built on `ksni` (a
# D-Bus StatusNotifierItem), so tray-icon's gtk backend is platform-gated dead
# code that is never compiled into nor shipped from any sharecli artifact. The
# Windows tray (the only consumer of tray-icon) compiles the `windows-sys`
# backend exclusively; glib 0.18.5's patched version is 0.20.0, a breaking
# release that gtk 0.18.2 does not accept, so there is no non-breaking upgrade.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0413"
reason = "gtk-rs 0.18 family, Linux-only gtk backend of tray-icon; not compiled or shipped by sharecli (Linux tray uses ksni). Dead platform-gated code."
