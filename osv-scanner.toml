# zbus family (zvariant / zbus_names / zvariant_derive) - two independent
# paths reach zbus, and neither one is compiled into a macOS or Windows
# sharecli artifact:
#   (a) sharecli-tray-linux -> ksni -> zbus.
#       crates/sharecli-tray-linux/Cargo.toml declares ksni under
#       [target.'cfg(target_os = "linux")'.dependencies], so this path is
#       Linux-only, and it is absent on FreeBSD.
#   (b) sharecli feature "desktop-notifications" -> notify-rust 4.18.2 ->
#       zbus. notify-rust 4.18.2 declares zbus under
#       [target.'cfg(all(unix, not(target_os = "macos")))'.dependencies],
#       which covers Linux, FreeBSD and the other BSDs and excludes macOS.
#       On FreeBSD this is the only path to zbus.
# zbus 5.x still re-exports the pre-merge crate names for source compat, but
# RustSec has flagged each of them as unmaintained now that they're folded into
# the monolithic `zbus` 6.x. All three are informational=unmaintained with
# patched = [], so there is no patched release to upgrade to. sharecli does
# not use these crates directly.
# The advisories still fire because neither scanner resolves per-target: both
# osv.yml and ci.yml pass --lockfile=Cargo.lock, and deny.yml runs bare `cargo
# deny check` with no [graph] target filter in deny.toml. Both read the
# target-agnostic root Cargo.lock, which lists zvariant, zbus_names and
# zvariant_derive regardless of the build target.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
reason = "zvariant unmaintained (folded into zbus 6.0.0 as zbus::wire); Two independent zbus paths reach it: (a) sharecli-tray-linux -> ksni -> zbus, gated by cfg(target_os = \"linux\") in crates/sharecli-tray-linux/Cargo.toml (Linux only, and absent on FreeBSD); (b) sharecli feature \"desktop-notifications\" -> notify-rust 4.18.2 -> zbus, gated by notify-rust's cfg(all(unix, not(target_os = \"macos\"))) target dep table, which covers Linux, FreeBSD and the other BSDs and excludes macOS - on FreeBSD notify-rust is the only path to zbus. macOS and Windows artifacts do not link zbus (cargo tree -i zbus --target aarch64-apple-darwin prints nothing). The advisory is still reported because both scanners read only the target-agnostic root Cargo.lock (osv.yml and ci.yml pass --lockfile=Cargo.lock; deny.yml runs bare cargo deny check and deny.toml has no [graph] target filter), which lists zvariant/zbus_names/zvariant_derive regardless of build target - neither scanner does per-target resolution. It is informational=unmaintained with patched = [], so no patched release exists to upgrade to."
[[IgnoredVulns]]
