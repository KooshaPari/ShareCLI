[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa Marvin-attack advisory covers every released version (introduced 0.0.0-0, no patched release). sharecli only decodes/verifies JWTs with RSA public keys for local sidecar auth (src/serve_auth.rs); it never performs network-exposed RSA private-key operations, which the advisory names as the unsafe setting."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "Informational 'unmaintained' advisory for the paste crate. paste 1.0.15 is a stale Cargo.lock entry: no package in the workspace dependency graph references it (cargo tree -i paste is empty), so there is nothing to replace."

# zbus family (zvariant / zbus_names / zvariant_derive) — Linux-only transitive
# deps of sharecli-tray-linux's ksni-based StatusNotifierItem client. zbus 5.x
# still re-exports the pre-merge crate names for source compat, but RustSec has
# flagged each of them as unmaintained now that they're folded into the
# monolithic `zbus` 6.x. sharecli does not use these crates directly; ksni
# pulls them in only when the Linux tray crate is built, and that crate is
# cfg(target_os = "linux")-gated. On Windows/macOS targets (the only
# sharecli CI matrices that gate on this scan) the entire ksni dep graph is
# excluded from compilation.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
reason = "zvariant unmaintained (folded into zbus 6.0.0 as zbus::wire); Linux-only transitive of sharecli-tray-linux via ksni/zbus. cfg(target_os = \"linux\")-gated; not compiled into Windows/macOS sharecli artifacts."
[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
reason = "zbus_names unmaintained (folded into zbus 6.0.0 as zbus::names); Linux-only transitive of sharecli-tray-linux via ksni/zbus. cfg(target_os = \"linux\")-gated; not compiled into Windows/macOS sharecli artifacts."
[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
reason = "zvariant_derive unmaintained (folded into zbus 6.0.0 derive macros); Linux-only transitive of sharecli-tray-linux via ksni/zbus. cfg(target_os = \"linux\")-gated; not compiled into Windows/macOS sharecli artifacts."

# proc-macro-error 1.0.4 (RUSTSEC-2024-0370) is a transitive build-time macro
# dep pulled in via tray-icon's libappindicator backend:
# sharecli-tray-windows -> tray-icon -> libappindicator -> gtk -> atk -> glib
#   -> glib-macros -> proc-macro-error.
# RustSec flagged proc-macro-error as unmaintained; 1.0.4 is the last released
# version and the maintainer has not published a replacement. It is a
# build-time only macro crate (no runtime effect on the sharecli binary).
# The path is Linux-only: tray-icon gates its `libappindicator` dep behind
# cfg(any(target_os = "linux", dragonfly, freebsd, netbsd, openbsd)), so
# `cargo tree -i proc-macro-error --target x86_64-pc-windows-msvc` and
# `--target aarch64-apple-darwin` both print nothing.
# cargo-deny considers it patched; OSV does not. We list it to ensure both
# scanners agree, mirroring the ignore in deny.toml.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error 1.0.4 unmaintained. Build-time macro transitive of sharecli-tray-windows via tray-icon's libappindicator backend; Linux-only because tray-icon gates libappindicator behind cfg(any(target_os = \"linux\", dragonfly, freebsd, netbsd, openbsd)). No patched release; build-time-only, no runtime impact on sharecli artifacts."

# glib 0.18.x (RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g alias) — RUSTSEC-2024-0429
# is an "unsound" advisory for glib::VariantStrIter's Iterator/DoubleEndedIterator
# impls (not an "unmaintained" one). The patched 0.20.0 release is a breaking
# change gtk 0.18.2 (also still in the tree) does not accept, so there is no
# non-breaking upgrade path. Reachable only on Linux: tray-icon's
# `libappindicator` feature pulls libappindicator/gtk, and tray-icon gates that
# dep behind cfg(any(target_os = "linux", dragonfly, freebsd, netbsd, openbsd)),
# so `cargo tree -i glib --target x86_64-pc-windows-msvc` and
# `--target aarch64-apple-darwin` both print nothing. The Rust
# sharecli-tray-windows crate is a dev-dependency of `sharecli` and IS
# compiled by Linux CI (`cargo tree -i glib-sys --target
# x86_64-unknown-linux-gnu -e normal,dev` resolves glib-sys through it), but
# it is not linked into any shipped artifact: release.yml builds only
# `--bin sharecli`, `-p sharecli-tray-linux` and `-p sharecli-ffi`, and the
# Windows tray ships as a C#/MSBuild WinUI app from windows/ShareCLITray.
# Listed here because OSV's lockfile
# scan does not consider 0.18.5 patched (cargo-deny does). Belt-and-suspenders;
# the deny.toml mirror is informational.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib 0.18.5 unsound glib::VariantStrIter Iterator/DoubleEndedIterator impls (informational=unsound). Linux-only: reached via sharecli-tray-windows -> tray-icon(libappindicator) -> libappindicator -> gtk -> atk -> glib, and tray-icon gates libappindicator behind cfg(any(target_os = \"linux\", dragonfly, freebsd, netbsd, openbsd)). Patched 0.20.0 is a breaking release gtk 0.18.2 cannot accept; no non-breaking upgrade."
[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
reason = "GHSA alias for RUSTSEC-2024-0429 (glib 0.18.5 unsound glib::VariantStrIter Iterator/DoubleEndedIterator impls); Linux-only via sharecli-tray-windows -> tray-icon(libappindicator) -> libappindicator -> gtk -> atk -> glib. No non-breaking fix."

