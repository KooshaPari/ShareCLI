id = "RUSTSEC-2023-0071"
reason = "rsa Marvin-attack advisory covers every released version (introduced 0.0.0-0, no patched release). sharecli only decodes/verifies JWTs with RSA public keys for local sidecar auth (src/serve_auth.rs); it never performs network-exposed RSA private-key operations, which the advisory names as the unsafe setting."

