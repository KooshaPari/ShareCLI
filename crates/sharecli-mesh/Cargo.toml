[package]
name = "sharecli-mesh"
version = "0.8.0"
edition = "2021"
description = "Mesh substrate for sharecli — Maildir-style task queue (ported from thegent)"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
