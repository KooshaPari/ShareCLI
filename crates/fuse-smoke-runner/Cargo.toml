[package]
name = "fuse-smoke-runner"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
description = "OS×arch privileged FUSE mount-smoke matrix runner (AC-009.22+)"
license = "MIT"
publish = false

[[bin]]
name = "fuse-smoke"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
