[package]
name = "sharecli-tray-windows"
version = "0.8.0"
edition = "2021"
description = "Native system-tray client for sharecli (FR-007 AC-007.51/AC-007.52/AC-007.54): tray-icon NotificationIcon + IPC sidecar spawn + dashboard link"
license = "MIT"
authors = ["Phenotype"]
repository = "https://github.com/KooshaPari/sharecli"

[lib]
name = "sharecli_tray_windows"
path = "src/lib.rs"

[[bin]]
name = "sharecli-tray-windows"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"] }

[dev-dependencies]

# tray-icon 0.25 refuses to compile on Linux/BSD unless `libappindicator` or `ksni`
# is on. ksni conflicts with sharecli-tray-linux (ksni default = tokio vs tray-icon's
# async-io zbus flavour), so use libappindicator; CI installs the system lib (#944).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"] }
