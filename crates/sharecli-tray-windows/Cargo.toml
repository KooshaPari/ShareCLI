[package]
name = "sharecli-tray-windows"
version = "0.8.0"
edition = "2021"
description = "Native system-tray client for sharecli (FR-007 AC-007.51/AC-007.52/AC-007.54): tray-icon NotificationIcon + IPC sidecar spawn + dashboard link"
license = "MIT"
authors = ["Phenotype"]
repository = "https://github.com/KooshaPari/sharecli"

[lib]
name = "sharecli_tray_windows"
path = "src/lib.rs"

[[bin]]
name = "sharecli-tray-windows"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.25", default-features = false }

# tray-icon 0.25 requires an explicit Linux/BSD backend when defaults are off.
# Preserve the GTK/AppIndicator backend; KSNI's async-io runtime conflicts with
# the Tokio runtime enabled by sharecli-tray-linux's existing ksni dependency.
# Keep Windows free of Linux backend dependencies.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = [
  "libappindicator",
] }

[dev-dependencies]
