[package]
name = "sharecli-fuse"
version = "0.8.0"
edition = "2021"
description = "FUSE IO-interception layer for the sharecli OS process/IO/syscall hypervisor"
license = "MIT"
build = "build.rs"

[[bin]]
name = "fuse-mount-smoke"
path = "src/bin/fuse-mount-smoke.rs"
required-features = []

[[bin]]
name = "mfmount-probe"
path = "src/bin/mfmount-probe.rs"
required-features = []

[[bin]]
name = "fuse-runtime-probe"
path = "src/bin/fuse-runtime-probe.rs"
required-features = []

[dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux — fuser (libfuse3 / pure-rust)
[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18"
libc = "0.2"
# wraps: xattr 1.x — portable setxattr/getxattr for write provenance
xattr = "1.6"

# macOS — fuser with `macos-no-mount`: compiles without macFUSE installed.
# GitHub-hosted macOS runners cannot install the macFUSE kernel extension, so
# the release matrix must build without it. The mount API remains present but
# reports unsupported at runtime; the macOS desktop tray (beta) does not mount
# FUSE, so this only affects the compile-time path.
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.18", features = ["macos-no-mount"] }
libc = "0.2"
xattr = "1.6"

# Windows — WinFsp (AC-009.25)
# wraps: winfsp 0.13 (SnowflakePowered/winfsp-rs)
[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", features = ["full", "windows-61"] }
# NOTE: xattr is Unix-only (its unsupported.rs fallback references std::os::unix),
# so Windows provenance uses NTFS alternate data streams instead (see provenance.rs).
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", features = ["build", "delayload"] }

[dev-dependencies]
tempfile = "3"
serial_test = "4"
