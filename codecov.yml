coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 1%
        paths:
          # All 16 Rust workspace members live in crates/ (post-crates migration).
          # Without these, the project status cannot find any source files and
          # reports 0% on PRs that touch crates/*/src/** (e.g. PR #876).
          - "crates/"
          - "crates/**/*.rs"
          # Legacy Python paths kept for any non-crates modules.
          - "src/"
          - "sharecli/"
          - "src/**/*.rs"
    patch:
      default:
        target: 80%
        threshold: 1%
        # Same crate scope for PR patch coverage.
        paths:
          - "crates/"
          - "crates/**/*.rs"

comment:
  layout: "reach, diff, flags, files, footer"
  behavior: default
  require_changes: true
  hide_project_coverage: false

ignore:
  - "**/tests/**"
  - "**/test_*.py"
  - "**/*_test.go"
  - "**/tests/"
  - "docs/"
  - ".github/"
  - "examples/"
  - "scripts/"

flags:
  unit:
    paths:
      - tests/unit/
    carryforward: true
  integration:
    paths:
      - tests/integration/
    carryforward: true
