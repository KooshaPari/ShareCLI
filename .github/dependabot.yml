version: 2
# C04 L37 — daily ecosystems + grouped patch/actions PRs (review still required)
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: daily }
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule: { interval: daily }
    open-pull-requests-limit: 10
    groups:
      cargo-patch:
        update-types:
          - patch
      cargo-minor:
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
