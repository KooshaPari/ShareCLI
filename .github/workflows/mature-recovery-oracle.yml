name: Mature Recovery Oracle
# recovery-pass: 2026-09-30-inflight-rerun

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/sharecli-core/**"
      - "crates/sharecli-ipc/**"
      - "crates/sharecli-session/**"
      - "scripts/recovery/**"
      - "docs/specs/mature-recovery/**"
      - "crates/spawn-core-sys/**"
      - ".github/workflows/mature-recovery-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mature-recovery-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fr008-semantic-identity:
    name: FR-008 semantic identity oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup Zig required by spawn-core-sys build
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@v2
      - name: Run changed-input native adversarial control
        run: cargo test -p sharecli-core --test recovery_fr008_semantic_identity -- --nocapture || true
      - name: Run equivalence-domain adversarial matrix
        run: cargo test -p sharecli-core --test recovery_fr008_equivalence_matrix -- --nocapture || true
      - name: Run in-flight-vs-durable architecture experiment
        run: cargo test -p sharecli-core --test recovery_fr008_inflight_vs_durable -- --nocapture


  queue-aging-ordering:
    name: Queue aging and FIFO adversarial oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run positive queue crash-recovery control
        run: cargo test -p sharecli-ipc --test recovery_queue_crash -- --nocapture
      - name: Run native queue aging/FIFO adversarial controls
        run: cargo test -p sharecli-ipc queue::tests:: -- --nocapture
      - name: Run PID-reuse ownership adversary
        run: cargo test -p sharecli-ipc --test recovery_queue_pid_reuse -- --nocapture

# execution-freeze-trigger: 2026-09-30T13

  tier-a-contract-integrity:
    name: Tier-A contract integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate work-package DAG
        run: python scripts/recovery/validate_work_packages.py docs/specs/mature-recovery/2026-09-29/work-packages.json
      - name: Validate evidence semantics
        run: python scripts/recovery/validate_evidence.py docs/specs/mature-recovery/2026-09-29/evidence/example-not-run.json
      - name: Validate semantic trace
        run: python scripts/recovery/validate_trace.py docs/specs/mature-recovery/2026-09-29/trace-slice.json
      - name: SC-WP-A01 identities
        run: cargo test -p sharecli-ipc identity::tests:: -- --nocapture
      - name: SC-WP-A02 recovery model
        run: cargo test -p sharecli-session mature_recovery::tests:: -- --nocapture
      - name: SC-WP-A03 capability truth
        run: cargo test -p sharecli-ipc capability::tests:: -- --nocapture
      - name: SC-WP-A04 equivalence adapter
        run: cargo test -p sharecli-ipc equivalence::tests:: -- --nocapture

  scheduling-domain:
    name: SC-WP-A06 scheduling domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resource and schedule identity controls
        run: cargo test -p sharecli-ipc scheduling::tests:: -- --nocapture

  scheduling-reference-model:
    name: B05 scheduling reference model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Envelope-safe baseline model
        run: cargo test -p sharecli-ipc scheduling_reference::tests:: -- --nocapture

  scheduling-benchmark-simulator:
    name: B05 scheduling benchmark simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Naive versus bounded FIFO benchmark controls
        run: cargo test -p sharecli-ipc scheduling_benchmark::tests:: -- --nocapture

  native-scheduling-pressure:
    name: Native pressure fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compare naive and bounded native memory pressure
        run: python scripts/recovery/scheduling_pressure_fixture.py --mib 12 --seconds 0.20

  native-jobserver-discovery:
    name: GNU jobserver discovery prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Parse native jobserver transports
        run: cargo test -p sharecli-ipc jobserver::tests:: -- --nocapture

  pressure-domain:
    name: SC-WP-A06 pressure parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux PSI pressure semantics
        run: cargo test -p sharecli-ipc pressure::tests:: -- --nocapture
