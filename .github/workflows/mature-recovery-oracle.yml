name: Mature Recovery Oracle

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/sharecli-core/**"
      - "crates/sharecli-ipc/**"
      - "crates/spawn-core-sys/**"
      - ".github/workflows/mature-recovery-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mature-recovery-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fr008-semantic-identity:
    name: FR-008 semantic identity oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup Zig required by spawn-core-sys build
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@v2
      - name: Run changed-input native adversarial control
        run: cargo test -p sharecli-core --test recovery_fr008_semantic_identity -- --nocapture || true
      - name: Run equivalence-domain adversarial matrix
        run: cargo test -p sharecli-core --test recovery_fr008_equivalence_matrix -- --nocapture || true
      - name: Run in-flight-vs-durable architecture experiment
        run: cargo test -p sharecli-core --test recovery_fr008_inflight_vs_durable -- --nocapture
