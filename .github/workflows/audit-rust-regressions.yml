name: Audit Rust regression (isolated, zero-spend)
on:
  push:
    branches: [audit/rust-regressions-20261007]
permissions:
  contents: read
concurrency:
  group: audit-rust-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pooled-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxdo-dev pkg-config
      - name: Execute actual ShareCLI regression test
        run: cargo test --locked -p sharecli --test run_pool_fail_closed_regression -- --nocapture
      - name: Verify process-lifetime permit and natural-exit regressions
        run: |
          cargo test --locked -p sharecli --test run_pool_fail_closed_regression build_permit -- --nocapture
          cargo test --locked -p sharecli --test run_pool_fail_closed_regression refresh_reaps -- --nocapture
      - name: Execute ShareCLI library tests
        run: cargo test --locked -p sharecli --lib
      - name: Execute IPC library tests
        run: cargo test --locked -p sharecli-ipc --lib
      - name: Execute real Unix socket supervisor regression
        run: cargo test --locked -p sharecli-ipc --bin sharecli-ipc supervisor_socket_tests -- --nocapture
      - name: Check formatting of touched Rust files
        run: rustfmt --edition 2021 --check src/runtime.rs tests/run_pool_fail_closed_regression.rs
      - name: Unix CLI-to-supervisor cross-invocation smoke
        run: |
          set -euo pipefail
          cargo build --locked -p sharecli -p sharecli-ipc --bins
          export SHARECLI_IPC_SOCK="$RUNNER_TEMP/sharecli-audit.sock"
          export SHARECLI_SESSION_DB="$RUNNER_TEMP/sharecli-audit.sqlite"
          if target/debug/sharecli start fixture --harness sleep --cwd "$RUNNER_TEMP" 20; then
            echo "ERROR: start must fail when supervisor is absent" >&2
            exit 1
          fi
          target/debug/sharecli-ipc >"$RUNNER_TEMP/ipc.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            test -S "$SHARECLI_IPC_SOCK" && break
            sleep 0.2
          done
          test -S "$SHARECLI_IPC_SOCK"
          target/debug/sharecli start fixture --harness sleep --cwd "$RUNNER_TEMP" 20
          python3 - <<'PY'
          import json, os, socket
          path = os.environ["SHARECLI_IPC_SOCK"]
          with socket.socket(socket.AF_UNIX) as client:
              client.connect(path)
              client.sendall(b'{"id":21,"method":"process.list","params":{}}\n')
              response = b""
              while not response.endswith(b"\n"):
                  response += client.recv(4096)
          result = json.loads(response)["result"]
          assert len(result) == 1, f"expected one supervisor-owned child: {result}"
          PY
          target/debug/sharecli ps --all --json >"$RUNNER_TEMP/ps.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ps.json")) as f:
              report = json.load(f)
          assert len(report["processes"]) == 1, f"ps must report supervisor child: {report['processes']}"
          PY
          target/debug/sharecli status --json >"$RUNNER_TEMP/status.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "status.json")) as f:
              report = json.load(f)
          assert report["total_processes"] == 1, f"status must report one supervisor child: {report['total_processes']}"
          PY
          target/debug/sharecli stop --all
          python3 - <<'PY'
          import json, os, socket
          with socket.socket(socket.AF_UNIX) as client:
              client.connect(os.environ["SHARECLI_IPC_SOCK"])
              client.sendall(b'{"id":22,"method":"process.list","params":{}}\n')
              response = b""
              while not response.endswith(b"\n"):
                  response += client.recv(4096)
          result = json.loads(response)["result"]
          assert result == [], f"expected empty supervisor registry after stop: {result}"
          PY
