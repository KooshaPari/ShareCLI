# =============================================================================
# eval.yml — C08 eval harness CI gate (T-1110, Wave19 gap remediation)
# =============================================================================
# Runs cargo bench, stores results as artifacts, compares against committed
# baselines, and fails on regression exceeding the configured threshold.
#
# Reads thresholds from eval.yaml (T-1110):
#   - max_regression_pct: 10.0
#   - min_pass_rate: 95.0
#
# Replaces the advisory-only `criterion` job in bench.yml for eval-gated
# benchmarks. The `bench-gate` job in bench.yml handles the committed-baseline
# comparison; this workflow adds the eval.yaml-driven threshold comparison.
# =============================================================================

name: eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly eval trend (C08 L74) — UTC 06:15 (offset from bench.yml at 06:00)
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SHARECLI_BENCH_SEED: "42"

jobs:
  # -------------------------------------------------------------------------
  # 1. Run Criterion benches and save baselines for comparison
  # -------------------------------------------------------------------------
  bench-run:
    name: bench run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxdo-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Record pins
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_STEP_SUMMARY
          echo "rustc=$(rustc --version)" >> $GITHUB_STEP_SUMMARY
          echo "seed=${SHARECLI_BENCH_SEED}" >> $GITHUB_STEP_SUMMARY

      - name: Run Criterion benches (eval config)
        run: |
          cargo bench --locked --bench config_parse \
            -- --sample-size 10 --warm-up-time 1 --measurement-time 2 \
            --save-baseline eval-ci
          cargo bench --locked --bench pool_list \
            -- --sample-size 10 --warm-up-time 1 --measurement-time 2 \
            --save-baseline eval-ci
          cargo bench --locked --bench prometheus_render \
            -- --sample-size 10 --warm-up-time 1 --measurement-time 2 \
            --save-baseline eval-ci
          cargo bench --locked --bench jwt_auth_validate \
            -- --sample-size 10 --warm-up-time 1 --measurement-time 2 \
            --save-baseline eval-ci

      - name: Export eval results JSON
        run: |
          python3 -c "
          import json, os, pathlib
          results = {}
          criterion_dir = pathlib.Path('target/criterion')
          for bench_dir in criterion_dir.iterdir():
              if bench_dir.is_dir() and bench_dir.name != 'report':
                  estimates = bench_dir / 'new' / 'estimates.json'
                  if estimates.exists():
                      data = json.loads(estimates.read_text())
                      results[bench_dir.name] = {
                          'mean_ns': data.get('mean', {}).get('point_estimate', 0),
                          'median_ns': data.get('median', {}).get('point_estimate', 0),
                          'std_dev_ns': data.get('std_dev', {}).get('point_estimate', 0),
                      }
          out = {
              'schema_version': 1,
              'sha': os.environ.get('GITHUB_SHA', 'local'),
              'baseline': 'eval-ci',
              'benches': results,
          }
          pathlib.Path('eval-results.json').write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          "

      - name: Upload eval results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results-${{ github.sha }}
          path: eval-results.json
          if-no-files-found: error
          retention-days: 90

  # -------------------------------------------------------------------------
  # 2. Compare eval results against committed baseline (eval.yaml thresholds)
  # -------------------------------------------------------------------------
  eval-gate:
    name: eval gate
    needs: bench-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download eval results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          name: eval-results-${{ github.sha }}

      - name: Compare against baseline with eval.yaml thresholds
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, sys, yaml

          # Load eval.yaml thresholds
          eval_cfg = yaml.safe_load(pathlib.Path('eval.yaml').read_text())
          thresholds = eval_cfg['thresholds']
          benchmarks = eval_cfg['benchmarks']
          max_regression = thresholds['max_regression_pct'] / 100.0
          min_pass_rate = thresholds['min_pass_rate']

          # Load committed baseline
          baseline_path = pathlib.Path('docs/eval/baselines/criterion-baseline.json')
          if not baseline_path.exists():
              print("::warning::No committed baseline found, skipping gate")
              sys.exit(0)
          baseline = json.loads(baseline_path.read_text())
          baseline_benches = baseline.get('benches', {})

          # Load eval results
          results_path = pathlib.Path('eval-results.json')
          if not results_path.exists():
              print("::error::eval-results.json not found")
              sys.exit(1)
          results = json.loads(results_path.read_text())
          result_benches = results.get('benches', {})

          # Compare each benchmark
          total = 0
          passed = 0
          failures = []

          for bench_cfg in benchmarks:
              target = bench_cfg['bench_target']
              threshold_ms = bench_cfg['threshold_ms']
              name = bench_cfg['name']

              if target not in result_benches:
                  print(f"::warning::Bench target '{target}' not in eval results (skipped)")
                  continue

              if target not in baseline_benches:
                  print(f"::warning::Bench target '{target}' not in baseline (skipped)")
                  continue

              total += 1
              measured_ns = result_benches[target]['mean_ns']
              baseline_ns = baseline_benches[target]['mean_ns']

              if baseline_ns == 0:
                  print(f"::warning::Baseline mean_ns is 0 for '{target}', skipping")
                  continue

              regression_pct = ((measured_ns - baseline_ns) / baseline_ns) * 100.0
              measured_ms = measured_ns / 1_000_000.0

              # Check against threshold_ms (absolute ceiling)
              over_threshold = measured_ms > threshold_ms
              # Check against max_regression_pct (relative to baseline)
              over_regression = regression_pct > (max_regression * 100)

              if over_threshold or over_regression:
                  failures.append({
                      'name': name,
                      'target': target,
                      'measured_ms': round(measured_ms, 2),
                      'baseline_ms': round(baseline_ns / 1_000_000.0, 2),
                      'regression_pct': round(regression_pct, 1),
                      'threshold_ms': threshold_ms,
                      'over_threshold': over_threshold,
                      'over_regression': over_regression,
                  })
                  print(f"FAIL {name} ({target}): {measured_ms:.2f}ms "
                        f"(baseline {baseline_ns/1_000_000:.2f}ms, "
                        f"regression {regression_pct:.1f}%)")
              else:
                  passed += 1
                  print(f"PASS {name} ({target}): {measured_ms:.2f}ms "
                        f"(regression {regression_pct:.1f}%)")

          # Evaluate pass rate
          if total == 0:
              print("::warning::No benchmarks were evaluated")
              sys.exit(0)

          pass_rate = (passed / total) * 100.0
          print(f"\n{'='*60}")
          print(f"Eval gate: {passed}/{total} passed ({pass_rate:.1f}%)")
          print(f"Threshold: min_pass_rate={min_pass_rate}%, max_regression={max_regression*100}%")

          if failures:
              print(f"\nFailed benchmarks ({len(failures)}):")
              for f in failures:
                  reason = []
                  if f['over_threshold']:
                      reason.append(f"exceeds {f['threshold_ms']}ms threshold")
                  if f['over_regression']:
                      reason.append(f"{f['regression_pct']}% regression > {max_regression*100}%")
                  print(f"  - {f['name']}: {', '.join(reason)}")

          if pass_rate < min_pass_rate:
              print(f"\n::error::Pass rate {pass_rate:.1f}% < min_pass_rate {min_pass_rate}%")
              sys.exit(1)

          if failures:
              print(f"\n::error::{len(failures)} benchmark(s) regressed beyond threshold")
              sys.exit(1)

          print("\n::notice::All benchmarks within threshold")
          PYEOF

  # -------------------------------------------------------------------------
  # 3. Store nightly trend (cron only)
  # -------------------------------------------------------------------------
  eval-trend:
    name: eval trend (nightly)
    if: github.event_name == 'schedule'
    needs: bench-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download eval results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          name: eval-results-${{ github.sha }}

      - name: Append to eval trends CSV
        run: |
          python3 -c "
          import json, csv, pathlib, datetime
          results = json.loads(pathlib.Path('eval-results.json').read_text())
          csv_path = pathlib.Path('docs/eval/trends/eval-trends.csv')
          csv_path.parent.mkdir(parents=True, exist_ok=True)
          write_header = not csv_path.exists() or csv_path.stat().st_size == 0
          with open(csv_path, 'a', newline='') as f:
              writer = csv.writer(f)
              if write_header:
                  writer.writerow(['date', 'sha', 'bench_target', 'mean_ns', 'median_ns', 'std_dev_ns'])
              date = datetime.date.today().isoformat()
              sha = results.get('sha', 'unknown')
              for target, vals in results.get('benches', {}).items():
                  writer.writerow([date, sha, target, vals.get('mean_ns', 0),
                                   vals.get('median_ns', 0), vals.get('std_dev_ns', 0)])
          "

      - name: Upload eval trend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-trend-${{ github.sha }}
          path: docs/eval/trends/eval-trends.csv
          if-no-files-found: warn
          retention-days: 365

  # -------------------------------------------------------------------------
  # 4. Gate test: validate eval.yaml structure in CI
  # -------------------------------------------------------------------------
  eval-config-gate:
    name: eval config gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1

      - name: Validate eval.yaml
        run: |
          python3 -c "
          import yaml, pathlib, sys
          cfg = yaml.safe_load(pathlib.Path('eval.yaml').read_text())
          assert 'benchmarks' in cfg, 'Missing benchmarks key'
          assert 'thresholds' in cfg, 'Missing thresholds key'
          assert len(cfg['benchmarks']) >= 4, f'Expected >= 4 benchmarks, got {len(cfg[\"benchmarks\"])}'
          for b in cfg['benchmarks']:
              assert 'name' in b, f'Benchmark missing name: {b}'
              assert 'bench_target' in b, f'Benchmark {b[\"name\"]} missing bench_target'
              assert 'threshold_ms' in b, f'Benchmark {b[\"name\"]} missing threshold_ms'
              assert b['threshold_ms'] > 0, f'Benchmark {b[\"name\"]} threshold_ms must be > 0'
          th = cfg['thresholds']
          assert 0 < th['min_pass_rate'] <= 100, f'min_pass_rate out of range: {th[\"min_pass_rate\"]}'
          assert 0 < th['max_regression_pct'] <= 100, f'max_regression_pct out of range: {th[\"max_regression_pct\"]}'
          print(f'eval.yaml valid: {len(cfg[\"benchmarks\"])} benchmarks, '
                f'min_pass_rate={th[\"min_pass_rate\"]}%, '
                f'max_regression={th[\"max_regression_pct\"]}%')
          "
