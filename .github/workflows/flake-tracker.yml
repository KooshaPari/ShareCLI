name: flake-tracker (C07 / L68)

# Plan 795 (T-900) — C07 / L68 Flake-tracker dashboard CI job.
# Score-3 evidence: this workflow runs scripts/flake_tracker.py against
# the PR's JUnit output, uploads flake-report.json as an artifact, and
# comments on the PR with a summary.
#
# Advisory only — continue-on-error: true. Flake handling is governed by
# docs/testing/flake-policy.md; the tracker is a signal, not a gate.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  flake-tracker:
    name: flake-tracker / report
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: setup python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: download nextest junit from this PR's ci run
        id: junit
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p audit/.flake-tracker

          # Default stub path (always present so the tracker never gets
          # an empty input set). We overwrite this if real JUnit arrives.
          STUB="audit/.flake-tracker/_stub-junit.xml"
          cat > "$STUB" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="flake-tracker-stub" tests="0" failures="0" errors="0" skipped="0"/>
          </testsuites>
          EOF
          FILES="$STUB"
          echo "::notice::Default stub at $STUB; will replace if real JUnit is downloaded."

          # Primary: download the JUnit artifact from the same PR's CI run
          # (nextest-junit is the conventional artifact name).
          if [ -n "${HEAD_RUN_ID:-}" ]; then
            if gh run download "$HEAD_RUN_ID" --name nextest-junit 2>/dev/null; then
              shopt -s nullglob
              REAL=( junit*.xml )
              if [ "${#REAL[@]}" -gt 0 ]; then
                FILES="${REAL[*]}"
                echo "::notice::Using real JUnit: $FILES"
              fi
            else
              echo "::notice::No nextest-junit artifact available for run ${HEAD_RUN_ID}; using stub."
            fi
          else
            # Secondary: any pre-existing junit.xml in workspace
            if [ -f junit.xml ]; then
              FILES="junit.xml"
              echo "::notice::Using workspace junit.xml"
            fi
          fi

          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: run flake_tracker
        shell: bash
        run: |
          set -euo pipefail
          FILES='${{ steps.junit.outputs.files }}'
          echo "Reading JUnit from: $FILES"
          python scripts/flake_tracker.py $FILES \
            --output audit/.flake-tracker/flake-report.json
          echo "--- flake-report.json (head) ---"
          head -40 audit/.flake-tracker/flake-report.json

      - name: upload report
        uses: actions/upload-artifact@v7
        with:
          name: flake-report
          path: audit/.flake-tracker/flake-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: comment on PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/comment_flake_tracker.py \
            --report audit/.flake-tracker/flake-report.json \
            --pr-number "$PR_NUMBER" 2>&1 || echo "::warning::comment step failed; flake signal still in artifact"

      - name: summary
        if: always()
        shell: bash
        run: |
          {
            echo "### flake-tracker summary"
            python - <<'PY' 2>/dev/null || echo "- no report"
          import json
          try:
              r = json.load(open('audit/.flake-tracker/flake-report.json'))
              print(f"- total_cases: {r['total_cases']}")
              print(f"- flake_rate: {r['flake_rate']:.4%}")
              print(f"- flaky: {len(r['flaky_cases'])}")
              print(f"- regression: {len(r['regression_cases'])}")
          except Exception as e:
              print(f'- no report: {e}')
          PY
          } >> "$GITHUB_STEP_SUMMARY"

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
