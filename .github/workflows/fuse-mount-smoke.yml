# Privileged FUSE mount-smoke matrix (AC-009.26)
# Local gate: `just fuse-smoke` / docs/ops/fuse-mount-smoke-matrix.md
# KooshaPari Actions billing often fails immediately — do not block merges on this workflow.

name: FUSE mount smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/sharecli-fuse/**'
      - 'crates/fuse-smoke-runner/**'
      - 'Containerfile.fuse-smoke'
      - 'tests/fr009_fuse_intercept.rs'
      - '.github/workflows/fuse-mount-smoke.yml'
  pull_request:
    paths:
      - 'crates/sharecli-fuse/**'
      - 'crates/fuse-smoke-runner/**'
      - 'Containerfile.fuse-smoke'
      - 'tests/fr009_fuse_intercept.rs'
      - '.github/workflows/fuse-mount-smoke.yml'

permissions:
  contents: read

jobs:
  linux-native:
    name: linux_native (ubuntu-24.04)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Install fuse3
        run: |
          sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev pkg-config
          # The mount smoke uses allow_other (multi-surface mounts); fuse3
          # refuses it unless user_allow_other is set in /etc/fuse.conf.
          sudo sh -c 'grep -q "^user_allow_other" /etc/fuse.conf || echo "user_allow_other" >> /etc/fuse.conf'
      - name: Privileged mount smoke
        env:
          SHARECLI_FUSE_MOUNT_SMOKE: '1'
        run: |
          cargo test -p sharecli --test fr009_fuse_intercept fr009_privileged_mount_smoke -- --nocapture --test-threads=1

  linux-container:
    name: linux_container (ubuntu-24.04)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Build + run Containerfile.fuse-smoke
        run: |
          docker build -f Containerfile.fuse-smoke -t sharecli-fuse-smoke:ci .
          docker run --rm --device /dev/fuse --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined sharecli-fuse-smoke:ci

  macos-native:
    name: macos_native (macos-latest)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Matrix cell macos_native (loud fail OK without macFUSE)
        run: cargo run -p fuse-smoke-runner --locked -- --cell macos_native --json --report-only

  windows-winfsp:
    name: windows_winfsp (windows-latest)
    runs-on: windows-latest
    continue-on-error: true
    env:
      # PhenoShared git-dep checkout content exceeds Windows MAX_PATH (260);
      # without this, cargo dies at dependency fetch with
      # `path too long ... class=Filesystem (30)` before any build runs.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Enable git long paths
        run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WinFsp (Developer)
        shell: pwsh
        run: |
          $url = "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
          $msi = "$env:RUNNER_TEMP\winfsp.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /qn ADDLOCAL=ALL"
          Get-ChildItem "C:\Program Files*\WinFsp\bin\winfsp-*.dll" -ErrorAction SilentlyContinue
      - name: Privileged WinFsp mount smoke
        shell: pwsh
        env:
          SHARECLI_FUSE_MOUNT_SMOKE: '1'
        run: |
          cargo run -p sharecli-fuse --locked --bin fuse-mount-smoke
          if ($LASTEXITCODE -ne 0) {
            cargo run -p fuse-smoke-runner --locked -- --cell windows_winfsp --json --report-only
          }

  runner-unit:
    name: fuse-smoke-runner unit
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p fuse-smoke-runner --locked
