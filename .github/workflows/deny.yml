name: Deny

# cargo-deny: license + ban + advisory + source policy enforcement.
# Config source of truth: deny.toml

on:
  push:
    branches: [main]
    paths:
      - 'deny.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'deny.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC (after audit)
  workflow_dispatch:

concurrency:
  group: deny-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Run cargo-deny (licenses, bans, advisories, sources)
        run: cargo deny check
