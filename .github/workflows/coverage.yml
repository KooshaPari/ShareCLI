name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COVERAGE_THRESHOLD: 85

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test coverage snapshot parser
        run: python -m unittest scripts/test_coverage_snapshot.py

      - name: Setup Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-llvm-cov

      # Guard must not inherit workflow CARGO_TERM_COLOR=always: libtest paints
      # "test" with ANSI, so `grep ': test$'` falsely reports an empty suite and
      # aborts before llvm-cov (post-#399 Wave15 failure mode).
      # Suite: full --workspace --all-features (same scope as llvm-cov below).
      - name: Guard — refuse empty test suite
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          OUT=$(cargo test --locked --all-features --workspace -- --list)
          COUNT=$(printf '%s\n' "$OUT" | grep -cE ': test$' || true)
          echo "Discovered tests: $COUNT"
          if [ "${COUNT:-0}" -le 0 ]; then
            echo "No tests discovered (cargo test -- --list). Failing coverage job."
            printf '%s\n' "$OUT" | tail -n 80
            exit 1
          fi

      - name: Run coverage (llvm-cov)
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo llvm-cov --version
          # Broad-workspace evidence suite: keep measuring even if a few package
          # tests fail (e.g. harness-native strategies needing a Tokio runtime).
          # Quality-gate remains the hard 85% unit gate; this job pins fleet %.
          cargo llvm-cov --locked --all-features --workspace --ignore-run-fail \
            --json --output-path coverage-llvm-cov.json
          cargo llvm-cov report --lcov --output-path lcov.info
          test -s coverage-llvm-cov.json
          python -c "import json,sys; d=json.load(open('coverage-llvm-cov.json')); t=d['data'][0]['totals']['lines']; print(f\"lines={t['percent']}% covered={t['covered']}/{t['count']}\"); sys.exit(0 if t['count']>0 else 1)"

      - name: Create coverage snapshot
        run: |
          python scripts/coverage_snapshot.py \
            coverage-llvm-cov.json coverage-snapshot.json \
            --git-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --threshold "${COVERAGE_THRESHOLD}"
          cat coverage-snapshot.json

      - name: Upload coverage snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-snapshot-${{ github.sha }}
          path: coverage-snapshot.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
