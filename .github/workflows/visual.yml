name: Visual Regression (Soft Gate -- Zig download transient failures)
on: [pull_request]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    continue-on-error: true  # Zig download mirrors are transient; promote to hard gate when infra stabilizes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - name: Build Dashboard Assets
        run: cargo build --release --locked 2>&1 | tail -5
      - name: Visual Snapshot Check
        run: |
          # Verify dashboard assets are consistent
          # Check golden snapshots exist
          test -d tests/golden || (echo "ERROR: Golden snapshot directory missing" && exit 1)
          # a11y test surface: tests/a11y.rs (+ tests/a11y/). The previous
          # check required `tests/a11y.html`, a file that never existed in
          # any commit (introduced by 17e02d07) and that no script reads —
          # scripts/a11y/axe-dashboard.mjs reads src/dashboard.html instead.
          # The guard's intent (a11y test surface present) is kept, pointed
          # at the real file.
          test -f tests/a11y.rs || (echo "ERROR: A11y test source missing" && exit 1)
          echo "Visual regression gate passed"
