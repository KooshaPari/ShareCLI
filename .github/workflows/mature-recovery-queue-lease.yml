name: Mature Recovery Queue Lease Qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/sharecli-ipc/**'
      - 'scripts/recovery/**'
      - '.github/workflows/mature-recovery-queue-lease.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-queue-lease-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-owned-waiter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@v2
      - name: Reject invalid positive-oracle logs
        run: python scripts/recovery/test_queue_lease_oracle.py -v
      - name: Native queue lease and actual child-death controls
        env:
          RECOVERY_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/recovery/run_queue_lease_oracle.py --candidate "$RECOVERY_CANDIDATE" --output evidence/queue-lease
      - name: Preserve exact-candidate raw evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: queue-lease-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/queue-lease/
          if-no-files-found: error
