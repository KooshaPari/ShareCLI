name: Load burst (soft)

# C05 L50 — soft healthz burst after serve comes up (continue-on-error).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-soft:
    name: healthz load burst (soft)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: load-soft
      - name: Build sharecli (release)
        run: cargo build --locked --release -p sharecli
      - name: Burst GET /healthz
        env:
          SHARECLI_LOAD_URL: http://127.0.0.1:9000/healthz
          SHARECLI_LOAD_N: "50"
        run: |
          set -euo pipefail
          ./target/release/sharecli serve --bind 127.0.0.1:9000 &
          serve_pid=$!
          trap 'kill $serve_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$SHARECLI_LOAD_URL"; then
              break
            fi
            sleep 1
          done
          curl -sf -o /dev/null "$SHARECLI_LOAD_URL"
          bash scripts/load/healthz_burst.sh
