###############################################################################
# Cross-platform CI (C07 L69 — score 3)
#
# Advisory matrix that validates the build on targets beyond ubuntu-latest:
#   - ubuntu-latest + macos-latest + windows-latest (full surface: build+test)
#   - FreeBSD (cross-compiled via cross-rs, no tests — link-only)
#   - x86_64-unknown-linux-musl (build+test via cross-rs)
#
# wasm32-unknown-unknown is intentionally NOT a build target here. No workspace
# crate is wasm-compatible today: sharecli-core pulls tokio (mio) and process
# spawn, and nothing is `cfg(target_arch = "wasm32")`-gated, so a full-workspace
# wasm build can never pass (mio has no wasm backend). This is recorded, not
# masked: see docs/ops/portability-freebsd-wasm.md. Re-add only after the
# process/network modules are cfg-gated and a real wasm-safe subset exists.
#
# sharecli-tray-windows declares the `tray-icon` libappindicator feature
# unconditionally, which resolves gtk-sys -> glib-sys on Linux. It is a Windows
# tray crate, so it is excluded from the musl/FreeBSD builds (a static musl /
# FreeBSD link cannot use the Ubuntu GTK stack). On ubuntu-latest the GTK/glib
# development packages are installed instead, because there it IS a real glib
# target.
#
# Signal workflow, not a required check: no job here is masked with
# `continue-on-error`, so a red run stays visible instead of being swallowed.
#
# All Unix targets require Zig 0.14.1: crates/spawn-core-sys/build.rs shells out
# to `zig build` (Linux) / `zig build-obj` (macOS) to produce libspawn_core.a.
# Windows uses the pure-Rust stub, so it needs no Zig. Every non-Windows job
# installs the same pinned Zig version used by ci-gate.yml.
###############################################################################

name: Cross-Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Tier 1: native OS matrix (build + test)
  # ------------------------------------------------------------------
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2

      - name: Setup Zig (spawn-core-sys build dependency)
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2
        with:
          version: 0.14.1

      - name: Install GTK/glib system deps (Linux --all-features tray build)
        # --all-features selects tray-icon/libappindicator, whose build scripts
        # need pkg-config + glib-2.0.pc + gtk-3 on a real Linux target.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libssl-dev

      - name: Build
        shell: bash
        run: |
          cargo build --workspace --all-features --locked 2>&1 | tail -5

      - name: Test (lib)
        run: cargo test --workspace --lib --no-fail-fast

  # ------------------------------------------------------------------
  # Tier 2: cross-compiled targets (build-only, no tests)
  # ------------------------------------------------------------------
  cross:
    name: cross / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            use-cross: false
          - target: x86_64-unknown-freebsd
            use-cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install target on active toolchain
        # rust-toolchain.toml pins channel 1.96.0, overriding the action's
        # 'stable' input. Add the target to whichever toolchain cargo resolves
        # so 'cargo build --target' can find std/core.
        run: rustup target add ${{ matrix.target }}

      - name: Setup Zig (spawn-core-sys build dependency)
        # Required by the native musl build (use-cross=false). For FreeBSD the
        # build runs inside the cross-rs container, which gets Zig via
        # .github/cross-freebsd.toml; the host install is harmless there.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2
        with:
          version: 0.14.1

      - name: Install musl tools (musl target C deps)
        # aws-lc-sys compiles C/asm and the cc crate looks for
        # `x86_64-linux-musl-gcc`; musl-tools provides `musl-gcc`, wired via CC_*.
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (FreeBSD)
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build (cross)
        # Exclude the Windows tray crate: its libappindicator feature resolves
        # GTK/glib, which cannot be satisfied in a musl/FreeBSD static link.
        if: matrix.use-cross
        env:
          CROSS_CONFIG: .github/cross-freebsd.toml
        run: cross build --target ${{ matrix.target }} --workspace --exclude sharecli-tray-windows --all-features

      - name: Build (native)
        if: "!matrix.use-cross"
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
        run: cargo build --target ${{ matrix.target }} --workspace --exclude sharecli-tray-windows --all-features --locked

      - name: Summary
        run: |
          echo "✅ ${{ matrix.target }} build succeeded" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # Tier 3: musl build + test (this one CAN run tests)
  # ------------------------------------------------------------------
  musl-test:
    name: musl-test (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install target on active toolchain
        # rust-toolchain.toml pins 1.96.0, not the action's 'stable'.
        # Add musl to the resolved toolchain.
        run: rustup target add x86_64-unknown-linux-musl

      - name: Setup Zig (spawn-core-sys build dependency)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2
        with:
          version: 0.14.1

      - name: Test (lib, musl)
        # sharecli-tray-windows pulls the GTK/glib stack via libappindicator and
        # is Windows-only; a musl static link cannot use it, so it is excluded
        # rather than given Ubuntu native GTK it can never link against.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
        run: cargo test --workspace --lib --exclude sharecli-tray-windows --target x86_64-unknown-linux-musl --no-fail-fast

      - name: Summary
        run: |
          echo "✅ musl lib tests succeeded" >> $GITHUB_STEP_SUMMARY
