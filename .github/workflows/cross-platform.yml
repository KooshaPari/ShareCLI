###############################################################################
# Cross-platform CI (C07 L69 — score 3)
#
# Advisory matrix that validates the build on targets beyond ubuntu-latest:
#   - ubuntu-latest + macos-latest + windows-latest (full surface: build+test)
#   - FreeBSD (cross-compiled via cross-rs, no tests — link-only)
#   - wasm32-unknown-unknown (link-only, no tests)
#   - x86_64-unknown-linux-musl (build+test via cross-rs)
#
# continue-on-error: true — this is a signal workflow, not a hard gate.
###############################################################################

name: Cross-Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Tier 1: native OS matrix (build + test)
  # ------------------------------------------------------------------
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 25
    env:
      # PhenoShared git-dep checkout content contains paths far beyond
      # Windows MAX_PATH (260). cargo's builtin git checkout fails with
      # `path too long ... class=Filesystem (30)` before any build/test
      # runs. Fetching via the git CLI + core.longpaths lets git resolve
      # them with \\?\-style extended paths. Harmless on Linux/macOS.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: Setup Zig (native matrix)
        # spawn-core-sys v0.8.0 build script shells out to `zig build-obj`;
        # without zig on PATH, every native test job fails with
        # `Error: failed to run 'zig build-obj': No such file or directory`.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with:
          version: 0.14.1

      - name: Build
        run: cargo build --workspace --all-features --locked 2>&1 | tail -5

      - name: Test (lib)
        run: cargo test --workspace --lib --no-fail-fast

  # ------------------------------------------------------------------
  # Tier 2: cross-compiled targets (build-only, no tests)
  # ------------------------------------------------------------------
  cross:
    name: cross / ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            use-cross: false
          - target: x86_64-unknown-freebsd
            use-cross: true
          - target: wasm32-unknown-unknown
            use-cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install target on active toolchain
        # rust-toolchain.toml pins channel 1.96.0, overriding the action's
        # 'stable' input. Add the target to whichever toolchain cargo resolves
        # so 'cargo build --target' can find std/core.
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (FreeBSD)
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --target ${{ matrix.target }} --workspace --all-features

      - name: Build (native)
        if: "!matrix.use-cross"
        run: cargo build --target ${{ matrix.target }} --workspace --all-features --locked

      - name: Summary
        run: |
          echo "✅ ${{ matrix.target }} build succeeded" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # Tier 3: musl build + test (this one CAN run tests)
  # ------------------------------------------------------------------
  musl-test:
    name: musl-test (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install target on active toolchain
        # rust-toolchain.toml pins 1.96.0, not the action's 'stable'.
        # Add musl to the resolved toolchain.
        run: rustup target add x86_64-unknown-linux-musl

      - name: Setup Zig (musl)
        # spawn-core-sys v0.8.0 build script shells out to `zig build-obj`.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with:
          version: 0.14.1

      - name: Test (lib, musl)
        run: cargo test --workspace --lib --target x86_64-unknown-linux-musl --no-fail-fast

      - name: Summary
        run: |
          echo "✅ musl lib tests succeeded" >> $GITHUB_STEP_SUMMARY
