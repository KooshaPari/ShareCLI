###############################################################################
# Cross-platform CI (C07 L69 — score 3)
#
# Advisory matrix that validates the build on targets beyond ubuntu-latest:
#   - ubuntu-latest + macos-latest + windows-latest (full surface: build+test)
#   - FreeBSD (cross-compiled via cross-rs, no tests — link-only)
#   - wasm32-unknown-unknown (link-only, no tests)
#   - x86_64-unknown-linux-musl (build+test via cross-rs)
#
# Signal workflow, not a required check: no job here is masked with
# `continue-on-error`, so a red run stays visible instead of being swallowed.
###############################################################################

name: Cross-Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Tier 1: native OS matrix (build + test)
  # ------------------------------------------------------------------
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable

      # spawn-core-sys (transitively brought in by the workspace) needs a zig
      # binary on every non-Windows runner, including macOS. Without it the
      # build stops at `zig build-obj: No such file or directory`.
      - name: Setup Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1

      # tray-icon/libappindicator (via sharecli-tray-windows, a workspace
      # member) makes glib-sys and gtk-sys part of the graph, so the runner
      # needs the GLib/Gtk development headers and pkg-config. Same package
      # list release.yml already installs.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxdo-dev pkg-config

      - name: Export macOS SDK for Zig libc
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Cargo cache
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266  # v2

      - name: Build
        shell: bash
        run: |
          cargo build --workspace --all-features --locked 2>&1 | tail -5

      - name: Test (lib)
        run: cargo test --workspace --lib --no-fail-fast

  # ------------------------------------------------------------------
  # Tier 2: cross-compiled targets (build-only, no tests)
  # ------------------------------------------------------------------
  cross:
    name: cross / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            use-cross: false
          - target: x86_64-unknown-freebsd
            use-cross: true
          - target: wasm32-unknown-unknown
            use-cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install target on active toolchain
        # rust-toolchain.toml pins channel 1.96.0, overriding the action's
        # 'stable' input. Add the target to whichever toolchain cargo resolves
        # so 'cargo build --target' can find std/core.
        run: rustup target add ${{ matrix.target }}

      # glib-sys/gtk-sys build scripts run pkg-config; without the dev
      # packages they fail with "failed to run custom build command for
      # glib-sys v0.18.1". Matches release.yml's Linux package list.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxdo-dev pkg-config

      - name: Install cross (FreeBSD)
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --target ${{ matrix.target }} --workspace --all-features

      - name: Build (native)
        if: "!matrix.use-cross"
        env:
          # pkg-config refuses to answer for a foreign target unless this is
          # set; the musl target otherwise fails in glib-sys' build script.
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: cargo build --target ${{ matrix.target }} --workspace --all-features --locked

      - name: Summary
        run: |
          echo "✅ ${{ matrix.target }} build succeeded" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # Tier 3: musl build + test (this one CAN run tests)
  # ------------------------------------------------------------------
  musl-test:
    name: musl-test (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        # glib-sys/gtk-sys are in the workspace graph via sharecli-tray-windows;
        # their build scripts need pkg-config and the dev headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libglib2.0-dev libgtk-3-dev libxdo-dev pkg-config

      - name: Install target on active toolchain
        # rust-toolchain.toml pins 1.96.0, not the action's 'stable'.
        # Add musl to the resolved toolchain.
        run: rustup target add x86_64-unknown-linux-musl

      - name: Test (lib, musl)
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: cargo test --workspace --lib --target x86_64-unknown-linux-musl --no-fail-fast

      - name: Summary
        run: |
          echo "✅ musl lib tests succeeded" >> $GITHUB_STEP_SUMMARY
