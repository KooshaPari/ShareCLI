name: Fuzz (soft)

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz ${{ matrix.target }} (soft)
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - toml_lite
          - dns_query_parser
          - snmpv3_msg
          - ssh_packet
          - coap_option_parse
          - ldap_filter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: fuzz
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Fuzz ${{ matrix.target }} (300s)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload corpus seeds
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-corpus
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: ignore
