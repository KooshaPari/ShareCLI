# Temporary helper: render sharecli(1) on Linux so the committed man page can be
# resynced from the same platform the release gate validates on. Dispatch only.
name: Regen man page

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render sharecli.1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: Render
        run: |
          cargo run --locked --bin sharecli -- man --install
          git --no-pager diff --stat -- share/man/man1/sharecli.1 || true
          sha256sum share/man/man1/sharecli.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharecli-man
          path: share/man/man1/sharecli.1
          retention-days: 1
