name: Mature Recovery Contract Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/specs/mature-recovery/**"
      - "scripts/recovery/**"
      - ".github/workflows/mature-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mature-recovery-contract-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  work-packages:
    name: Validate work-package DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate
        run: python scripts/recovery/validate_work_packages.py docs/specs/mature-recovery/2026-09-29/work-packages.json

  evidence-fixture:
    name: Validate evidence receipt semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate non-green fixture
        run: python scripts/recovery/validate_evidence.py docs/specs/mature-recovery/2026-09-29/evidence/example-not-run.json

  a01-identities:
    name: SC-WP-A01 identity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test additive semantic identities
        run: cargo test -p sharecli-ipc identity::tests:: -- --nocapture

  a02-a04-contracts:
    name: SC-WP-A02-A04 additive contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Recovery subject model
        run: cargo test -p sharecli-session mature_recovery::tests:: -- --nocapture
      - name: Capability contract
        run: cargo test -p sharecli-ipc capability::tests:: -- --nocapture
      - name: Equivalence contract
        run: cargo test -p sharecli-ipc equivalence::tests:: -- --nocapture
