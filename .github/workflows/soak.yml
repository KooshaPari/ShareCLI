name: Harbor Soak (Nightly Gate)

# T-980 — nightly Harbor soak gate (C08 L76).
# Builds sharecli in release mode, runs the soak harness for 600 s,
# and asserts that the soak report meets minimum thresholds.
#
# This is the HARD gate counterpart of soak-soft.yml which only does a
# quick /healthz poke.  Here we drive the full soak binary path.

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: soak-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SOAK_REPORT: soak-report.json
  SOAK_DURATION_SEC: "600"
  # zig needs a writable cache dir; HOME is not usable on the self-hosted runner
  ZIG_GLOBAL_CACHE_DIR: /tmp/zig-global-cache
  ZIG_LOCAL_CACHE_DIR: /tmp/zig-local-cache

jobs:
  soak:
    name: Harbor Soak (Nightly Gate)
    runs-on: [self-hosted, Linux, X64, desk-sharecli]
    timeout-minutes: 90

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Rust toolchain ────────────────────────────────────────────────
      - name: Use desk Rust toolchain
        run: |
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: soak-nightly

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build sharecli (release)
        run: cargo build --locked --release -p sharecli

      # ── Soak config ──────────────────────────────────────────────────
      - name: Ensure soak.yaml exists
        run: |
          if [ ! -f soak.yaml ]; then
            cat > soak.yaml <<'YAML'
          # soak.yaml — minimal default config generated by CI
          # T-980: Harbor soak nightly gate
          duration_seconds: 600
          report_file: soak-report.json
          thresholds:
            max_error_rate: 0.05
            min_uptime_pct: 95.0
            max_p99_latency_ms: 2000
          YAML
            echo "Created default soak.yaml"
          else
            echo "Using existing soak.yaml"
          fi

      # ── Soak run ─────────────────────────────────────────────────────
      # The soak scenarios in soak.yaml call bare `sharecli`, so the freshly
      # built binary must be on PATH.
      - name: Put built sharecli on PATH
        run: echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      - name: Run Harbor soak (600 s)
        id: run_soak
        run: |
          set -euo pipefail
          rm -f "$SOAK_REPORT"

          echo "::group::Soak harness output"
          # `soak` is a flat subcommand (no `run`). A non-zero exit fails the step.
          rc=0
          timeout 700 ./target/release/sharecli soak \
            --duration 600 \
            --interval 30 \
            --config soak.yaml \
            --output "$SOAK_REPORT" || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "soak exit code: $rc"
          echo "::endgroup::"
          [ "$rc" -eq 0 ] || { echo "::error::soak exited $rc"; exit "$rc"; }

          # No synthesised fallback: a missing report is a failure.
          test -s "$SOAK_REPORT" || { echo "::error::soak report missing"; exit 1; }

      # ── Upload artifacts ──────────────────────────────────────────────
      - name: Upload soak report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-report-${{ github.run_id }}
          path: |
            soak-report.json
            soak.yaml
          if-no-files-found: warn
          retention-days: 90

      # ── Threshold gate ────────────────────────────────────────────────
      - name: Assert soak thresholds
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          echo "::group::Soak threshold assertions"

          python3 - <<'PY'
          import json, sys

          REPORT = "soak-report.json"
          try:
              with open(REPORT) as f:
                  data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError) as exc:
              print(f"::error::Cannot read {REPORT}: {exc}", file=sys.stderr)
              sys.exit(1)

          errors = []

          # 0. The soak must have actually run for (about) the configured time
          #    and made requests. Guards against empty or synthetic reports.
          duration = float(data.get("duration_sec", 0) or 0)
          if duration < 590:
              errors.append(f"duration_sec {duration} is below 590 (soak did not run the full duration)")
          if float(data.get("total_requests", 0) or 0) <= 0:
              errors.append("total_requests is 0 (no scenarios ran)")
          if "synthesised" in str(data.get("note", "")):
              errors.append("report is synthesised, not produced by the soak binary")

          # 1. Error rate must stay below 5 %
          error_rate = float(data.get("error_rate", 1.0))
          if error_rate > 0.05:
              errors.append(f"error_rate {error_rate:.4f} exceeds 0.05 threshold")

          # 2. Uptime must be >= 95 %
          uptime = float(data.get("uptime_pct", 0.0))
          if uptime < 95.0:
              errors.append(f"uptime_pct {uptime:.2f} below 95.0 threshold")

          # 3. p99 latency must be <= 2 000 ms
          p99 = float(data.get("p99_latency_ms", 99999))
          if p99 > 2000:
              errors.append(f"p99_latency_ms {p99} exceeds 2000 ms threshold")

          if errors:
              print("::error::Soak gate FAILED", file=sys.stderr)
              for e in errors:
                  print(f"  ✗ {e}", file=sys.stderr)
              sys.exit(1)

          print("✅ Soak gate PASSED")
          print(f"   error_rate  = {error_rate:.4f}  (threshold 0.05)")
          print(f"   uptime_pct  = {uptime:.2f}%  (threshold 95.0%)")
          print(f"   p99_latency = {p99} ms  (threshold 2000 ms)")
          PY

          echo "::endgroup::"
