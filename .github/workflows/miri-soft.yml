name: Miri (soft)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'crates/harness-native/**'
      - 'src/**'
      - '.github/workflows/miri-soft.yml'

permissions:
  contents: read

jobs:
  miri:
    name: cargo miri (soft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri (harness-native lib tests)
        id: miri
        run: |
          cd crates/harness-native
          set +e
          cargo miri test --locked --lib 2>&1 | tee miri.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo miri reported failures (exit ${status})"
          fi
          exit 0
      - name: Fail if miri failed
        if: always()
        run: |
          status="${{ steps.miri.outputs.status }}"
          if [ -z "${status}" ]; then
            echo "::error::miri step did not report status"
            exit 1
          fi
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
