# ============================================================================
# Release Pipeline — CLI matrix (linux + macOS + windows) + tray archives + crates.io
# ============================================================================
# Builds release archives:
#   Linux  · x86_64-unknown-linux-gnu  → sharecli-*-unknown-linux-gnu.tar.gz
#   macOS  · aarch64-apple-darwin      → sharecli-*-apple-darwin.tar.gz
#   Windows· x86_64-pc-windows-msvc    → sharecli-*-pc-windows-msvc.zip
#   Tray   · linux tray + macOS desktop + windows tray (Win soft)
#
# Triggered by workflow_dispatch, `chore(release): ...` on main, or `v*` tags.
# Tag/dispatch path attaches UNSIGNED archives + sha256 (+ SBOM) to a GitHub Release.
# Codesign/notarization (L112) remains deferred — assets are checksummed, not signed.
# Parity floor: docs/deploy/FINALITY.md
# ============================================================================

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish crates.io / skip GH Release attach)'
        required: false
        default: 'true'
        type: boolean
      attach_github_release:
        description: 'Attach unsigned archives to a GitHub Release (tag or v{Cargo.toml version})'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1

      - name: Export macOS SDK for Zig libc
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxdo-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Build release binary
        shell: bash
        env:
          # Reproducibility seed for release binaries (C06 L52).
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          cargo build --release --locked --bin sharecli --target ${{ matrix.target }}

      - name: Install cargo-cyclonedx
        if: runner.os != 'Windows'
        run: cargo install --locked cargo-cyclonedx

      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_KIND="${{ matrix.archive }}"
          STAGE="sharecli-${VERSION}-${TARGET}"
          mkdir -p "${STAGE}"
          BIN="target/${TARGET}/release/sharecli"
          if [[ ! -f "${BIN}" ]]; then
            BIN="target/${TARGET}/release/sharecli.exe"
          fi
          if [[ "${BIN}" == *.exe ]]; then
            cp "${BIN}" "${STAGE}/sharecli.exe"
          else
            cp "${BIN}" "${STAGE}/sharecli"
          fi
          if command -v cargo-cyclonedx >/dev/null 2>&1; then
            cargo cyclonedx --format json --spec-version 1.5 --override-filename sharecli
            if [[ -f sharecli.json ]]; then
              mv -f sharecli.json sharecli.cdx.json
            fi
            if [[ -f sharecli.cdx.json ]]; then
              cp sharecli.cdx.json "${STAGE}/sharecli.cdx.json"
            fi
          fi
          if [[ "${ARCHIVE_KIND}" == "zip" ]]; then
            ARCHIVE="sharecli-${TARGET}.zip"
            if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
              # `zip` is not preinstalled on windows-latest GitHub-hosted runners; use
              # PowerShell `Compress-Archive` + `Get-FileHash` instead, matching the
              # parity pattern already used by the `tray-windows` job.
              echo ">> Windows runner: using Compress-Archive (zip is not preinstalled on windows-latest)"
              SHARECLI_STAGE="${STAGE}" SHARECLI_ARCHIVE="${ARCHIVE}" \
                powershell.exe -NoProfile -Command \
                'Compress-Archive -Path "$env:SHARECLI_STAGE/*" -DestinationPath "$env:SHARECLI_ARCHIVE" -Force'
              SHARECLI_STAGE="${STAGE}" SHARECLI_ARCHIVE="${ARCHIVE}" \
                powershell.exe -NoProfile -Command \
                'Get-FileHash -Path "$env:SHARECLI_ARCHIVE" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $env:SHARECLI_ARCHIVE)" } | Tee-Object -FilePath ($env:SHARECLI_ARCHIVE + ".sha256")'
            else
              (cd "${STAGE}" && zip -r "../${ARCHIVE}" .)
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "${ARCHIVE}" | tee "${ARCHIVE}.sha256"
              else
                shasum -a 256 "${ARCHIVE}" | tee "${ARCHIVE}.sha256"
              fi
            fi
          else
            ARCHIVE="sharecli-${TARGET}.tar.gz"
            tar -czf "${ARCHIVE}" -C "${STAGE}" .
            shasum -a 256 "${ARCHIVE}" | tee "${ARCHIVE}.sha256"
          fi
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload platform artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharecli-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Setup Node
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm deps (a11y dashboard gate)
        if: matrix.os == 'ubuntu-24.04'
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Test release build (host)
        if: matrix.os == 'ubuntu-24.04'
        # Default features only: --all-features enables the dhat-heap profiler,
        # whose process-exit report pollutes stderr and breaks the fr007
        # stderr-silent contracts (AC-007.44/76/82).
        run: cargo test --release --locked

  tray-linux:
    name: Tray Linux (beta)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-tray-linux
      - name: Build + pack
        run: |
          set -euo pipefail
          cargo build -p sharecli-tray-linux --release --locked
          STAGE=sharecli-tray-linux
          mkdir -p "$STAGE"
          cp target/release/sharecli-tray "$STAGE/sharecli-tray"
          ARCHIVE=sharecli-tray-linux-x86_64.tar.gz
          tar -czf "$ARCHIVE" -C "$STAGE" .
          shasum -a 256 "$ARCHIVE" | tee "${ARCHIVE}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharecli-tray-linux-x86_64
          path: |
            sharecli-tray-linux-x86_64.tar.gz
            sharecli-tray-linux-x86_64.tar.gz.sha256

  tray-macos:
    name: Desktop macOS (beta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Export macOS SDK for Zig libc
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-tray-macos
      - name: Build sharecli-ffi
        run: cargo build -p sharecli-ffi --release --locked
      - name: Swift build ShareCLITray
        working-directory: desktop/ShareCLITray
        env:
          SHARECLI_FFI_LIB_DIR: ${{ github.workspace }}/target/release
        run: |
          set -euo pipefail
          export LIBRARY_PATH="${SHARECLI_FFI_LIB_DIR}:${LIBRARY_PATH:-}"
          swift build -c release \
            -Xlinker -L -Xlinker "${SHARECLI_FFI_LIB_DIR}" \
            -Xlinker -lsharecli_ffi
      - name: Pack artifact
        run: |
          set -euo pipefail
          BIN=$(swift build -c release --package-path desktop/ShareCLITray --show-bin-path)/ShareCLITray
          STAGE=sharecli-desktop-macos
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/ShareCLITray"
          cp target/release/libsharecli_ffi.dylib "$STAGE/" 2>/dev/null || true
          ARCHIVE=sharecli-desktop-macos-aarch64.tar.gz
          tar -czf "$ARCHIVE" -C "$STAGE" .
          shasum -a 256 "$ARCHIVE" | tee "${ARCHIVE}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharecli-desktop-macos-aarch64
          path: |
            sharecli-desktop-macos-aarch64.tar.gz
            sharecli-desktop-macos-aarch64.tar.gz.sha256
          if-no-files-found: error

  tray-windows:
    name: Tray Windows (beta soft)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Build WinUI tray
        working-directory: windows/ShareCLITray
        run: msbuild ShareCLITray.csproj /restore /p:Configuration=Release /p:Platform=x64
      - name: Pack zip
        shell: pwsh
        run: |
          $out = Get-ChildItem -Recurse windows/ShareCLITray/bin -Filter ShareCLITray.exe | Select-Object -First 1
          if (-not $out) { Write-Error "ShareCLITray.exe not found"; exit 1 }
          New-Item -ItemType Directory -Force pack | Out-Null
          Copy-Item $out.FullName pack/
          Compress-Archive -Path pack/* -DestinationPath sharecli-tray-windows-x64.zip -Force
          Get-FileHash sharecli-tray-windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  sharecli-tray-windows-x64.zip" } |
            Tee-Object sharecli-tray-windows-x64.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharecli-tray-windows-x64
          path: |
            sharecli-tray-windows-x64.zip
            sharecli-tray-windows-x64.zip.sha256
          if-no-files-found: warn

  attest:
    name: SLSA Build Attestation (L2)
    needs: [build, tray-linux, tray-macos, tray-windows]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: sharecli-*
          merge-multiple: false

      - name: Flatten artifact tree
        run: |
          set -euo pipefail
          find release-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -print
          ls -laR release-artifacts/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 90
          if-no-files-found: warn

      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release-artifacts/**/*.{tar.gz,zip}"

  publish:
    name: Publish to crates.io
    needs: build
    # Only live-publish on explicit non-dry workflow_dispatch or chore(release) commits.
    # Default dispatch uses dry_run=true; attach path must not depend on crates.io.
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore(release)'))
    runs-on: ubuntu-24.04
    environment: release
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Publish (uses CARGO_REGISTRY_TOKEN from environment)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo ">> DRY RUN — running cargo publish --dry-run"
            cargo publish --dry-run --locked
          else
            echo ">> LIVE PUBLISH"
            cargo publish --locked
          fi

  # Unsigned GitHub Release attach (L118). Uses GITHUB_TOKEN only — no Apple secrets.
  # CLI (linux/mac/win) + tray-linux + tray-macos hard; tray-windows soft (continue-on-error).
  github-release:
    name: Attach unsigned assets to GitHub Release
    needs: [build, tray-linux, tray-macos, tray-windows]
    if: >
      always() &&
      needs.build.result == 'success' &&
      needs.tray-linux.result == 'success' &&
      needs.tray-macos.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.attach_github_release == 'true' && github.event.inputs.dry_run != 'true')
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: sharecli-*
          merge-multiple: true
          # Win tray may be absent when soft job fails
          if-no-files-found: warn

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          shopt -s nullglob
          ASSETS=(release-artifacts/*.tar.gz release-artifacts/*.zip release-artifacts/*.sha256)
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "No release assets found under release-artifacts/"
            ls -laR release-artifacts || true
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "${TAG}" \
              --notes "Unsigned CLI + tray archives (see docs/deploy/FINALITY.md). Not notarized."
          fi
