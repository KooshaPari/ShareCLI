name: OSV Scanner

# C04 L38 — OSV/GHSA feed beyond RustSec cargo-audit (hard HIGH/CRITICAL gate).
# The PR-side OSV scan used to live in `.github/workflows/ci.yml` (`osv` job
# feeding the `ci-success` aggregator). That job was deleted with the legacy CI
# workflow (2026-10-17); PR-time coverage is restored here by the
# `pull_request` trigger below, so there is no longer a gap between push to
# main and the next weekly cron. This workflow is NOT in the required
# `ci / lint` / `ci / test` branch-protection contexts.
on:
  push:
    branches: [main]
  # Restored PR-time coverage (review finding on PR #933).
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    name: OSV / GHSA lockfile scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Cargo.lock with OSV-Scanner
        # Severity gate intent: --severity=HIGH,CRITICAL (documented; osv-scanner
        # v2.3.8 has no CLI severity flag — findings gate via code-scanning alerts).
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --config=osv-scanner.toml
            --format=sarif
            --output=osv-results.sarif
      - name: Upload SARIF
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: osv-results.sarif
        continue-on-error: true
