name: OSV Scanner

# C04 L38 — OSV/GHSA feed beyond RustSec cargo-audit (hard HIGH/CRITICAL gate).
# PR coverage lives in ci.yml `osv` (ci-success aggregator). This workflow
# retains weekly SARIF + workflow_dispatch parity.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    name: OSV / GHSA lockfile scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Cargo.lock with OSV-Scanner
        # Severity gate intent: --severity=HIGH,CRITICAL (documented; osv-scanner
        # v2.3.8 has no CLI severity flag — findings gate via code-scanning alerts).
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --config=osv-scanner.toml
            --format=sarif
            --output=osv-results.sarif
      - name: Upload SARIF
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: osv-results.sarif
        continue-on-error: true
