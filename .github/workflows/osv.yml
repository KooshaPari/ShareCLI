name: OSV Scanner

# C04 L38 — OSV/GHSA feed beyond RustSec cargo-audit (hard HIGH/CRITICAL gate).
# The PR-side OSV scan that used to live in `.github/workflows/ci.yml` (`osv`
# job feeding the `ci-success` aggregator) was retired together with the
# legacy CI workflow (2026-10-17). This workflow retains weekly SARIF +
# workflow_dispatch parity and is NOT in the required `ci / lint` / `ci / test`
# branch-protection contexts.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    name: OSV / GHSA lockfile scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Cargo.lock with OSV-Scanner
        # Severity gate intent: --severity=HIGH,CRITICAL (documented; osv-scanner
        # v2.3.8 has no CLI severity flag — findings gate via code-scanning alerts).
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --config=osv-scanner.toml
            --format=sarif
            --output=osv-results.sarif
      - name: Upload SARIF
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: osv-results.sarif
        continue-on-error: true
