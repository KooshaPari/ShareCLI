# =============================================================================
# Branch protection on main requires check contexts `ci / lint` and `ci / test`.
# The legacy `CI` workflow (name: CI) did not define `lint`/`test` jobs, so
# those contexts could not resolve; this workflow provides them.
#
# This workflow makes the required contexts resolvable AND honest:
#   - `cargo fmt --check` and `cargo check --all-targets` are hard gates.
#   - `cargo clippy` and `cargo nextest` are hard gates: a non-zero exit fails
#     the required check (no `|| true`, no warning-only swallow). Pre-existing
#     debt must be fixed or tracked by an explicit, bounded allowlist naming
#     exact test ids - never by hiding failures.
# =============================================================================
#
# Sole-CI declaration (2026-10-17, corrected 2026-10-31): the legacy
# `.github/workflows/ci.yml` (workflow name `CI`) was deleted in the same PR
# that added this note. This file is the single source of truth for the
# required `ci / lint` and `ci / test` branch-protection contexts.
#
# Job-by-job mapping from the deleted `ci.yml`. Nothing is dropped silently.
# An earlier revision of this note claimed everything was "covered or
# superseded"; that was untrue for Loom, nextest, OSV-on-PR, the hard netblock
# gate and PR-time chaos (review findings on PR #933).
#
#   detect             -> not needed; this workflow has no path-detection
#                         fan-out (it is Rust-only by contract).
#   rust (fmt/clippy)  -> `ci-lint` (hard `cargo fmt --check` and hard
#                         `cargo clippy -- -D warnings`).
#   rust (cargo test)  -> `ci-test` (nextest).
#   guardrail (nextest)-> `ci-test`. NOTE: `ci.yml` was also what installed
#                         cargo-nextest. The install now lives in `ci-test`
#                         itself (pinned `taiki-e/install-action`) and fails
#                         the job if nextest is missing from PATH.
#   loom               -> `ci-loom` below. `cfg(loom)` is NOT enabled by any
#                         ordinary `cargo check`/`nextest` run, so it needs
#                         its own job.
#   netblock (hard)    -> `ci-netblock` below. `netblock-soft.yml` is
#                         `continue-on-error: true` and cannot stand in for the
#                         hard gate that `ci.yml` provided.
#   osv (PR)           -> `osv.yml` now also runs on `pull_request`.
#   chaos-restart-hard -> `chaos-restart-hard.yml` now also runs on
#                         `pull_request` (docs/ops/chaos-restart-hard-gate.md).
#   cargo-deny         -> `deny.yml` (pull_request, PATH-FILTERED on
#                         Cargo.toml/Cargo.lock/deny.toml - narrower than the
#                         unfiltered `ci.yml` job).
#   cargo-audit        -> `audit.yml` (pull_request, path-filtered).
#   security/gitleaks  -> `security.yml` (pull_request).
#   go                 -> deleted; never ran (`detect` required `go.mod`, which
#                         does not exist).
#   typescript         -> deleted; effectively a no-op. The job only ran
#                         `npm run lint` / `npm test` when those scripts existed
#                         in package.json, and the root package.json (name:
#                         "docs", a vitepress/playwright toolchain) defines
#                         neither. Its one real action, `npm ci`, is still
#                         exercised on PRs by `a11y.yml`.
#   python             -> deleted; KNOWN GAP, not silently dropped. The job was
#                         advisory (`continue-on-error: true`) and did run, because
#                         `scripts/*.py` (10 files) satisfies `detect`'s python
#                         rule. Advisory `ruff check` / `ruff format --check` over
#                         scripts/ therefore no longer runs on PRs. Restoring it
#                         needs a pytest/ruff workflow rather than a job in this
#                         Rust CI file; tracked as a follow-up.
#   dep-review         -> deleted; superseded by `deny.yml` + `audit.yml`.
#   lint/test/ci-success aggregators -> replaced by the two required contexts
#                         `ci / lint` and `ci / test`, the only contexts branch
#                         protection requires.
#
# If you reintroduce a second CI workflow, expect branch protection to fail
# because the required `ci / lint` / `ci / test` contexts would compete.
# =============================================================================

name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  merge_group:

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  statuses: write

jobs:
  ci-lint:
    name: ci / lint
    # `ci / lint` is a REQUIRED branch-protection context, and it is also the
    # context `.mergify.yml` gates automatic merges on
    # (check-success=ci / lint, check-success=ci / test). The deleted
    # `.github/workflows/ci.yml` ran `netblock` as a HARD job (no
    # `continue-on-error`), but that job was a sibling of `lint` rather than
    # one of `lint`'s `needs:`, so a failed netblock gate did not turn any
    # required context red and the merge still went through. The CI dedup
    # carried `netblock` over to `ci-netblock` without that dependency, which
    # left the same hole: the hard gate ran but did not gate.
    #
    # Restoring the dependency here makes the hard gate actually gate, without
    # touching branch protection or Mergify configuration.
    #
    # Scope note: the old `osv` and `chaos-restart-hard` jobs were
    # `continue-on-error: true`, i.e. they never blocked a merge either, so
    # they are deliberately NOT added here. Making them hard would be a new
    # policy, not a restoration of the pre-dedup behaviour.
    needs: [ci-netblock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify hard gates passed
        # The gate job does the real enforcement; this step turns its result
        # into the failure of a REQUIRED context, which is what branch
        # protection (and Mergify) blocks the merge on.
        env:
          NETBLOCK_RESULT: ${{ needs.ci-netblock.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in "ci-netblock:${NETBLOCK_RESULT}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success|skipped) echo "  ok  $name: $result" ;;
              *) echo "  FAIL $name: $result"; failed=$((failed + 1)) ;;
            esac
          done
          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "::error::$failed hard CI gate(s) failed; this required context must not pass"
            exit 1
          fi
          echo "All hard CI gates passed"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxdo-dev pkg-config libayatana-appindicator3-dev
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Format (rustfmt)
        # rustfmt.toml pins the stable toolchain to 1.96.0 via dtolnay/rust-toolchain.
        # group_imports / indent_style are configured in rustfmt.toml.
        run: |
          fmt_log="$(mktemp)"
          set +e
          cargo fmt --all -- --check >"$fmt_log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "rustfmt OK"
            exit 0
          fi
          if grep -q '^Diff in ' "$fmt_log"; then
            cat "$fmt_log"
            exit 1
          fi
          cat "$fmt_log"
          echo "::error::cargo fmt --check failed with exit code ${status}"
          exit "$status"
      - name: Lint (clippy)
        shell: bash
        run: |
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Post legacy commit-status for merge gate
        # GitHub's merge API polls the legacy /statuses endpoint under
        # strict branch protection. Re-publish the modern check-run
        # status as a legacy commit-status so GraphQL `mergePullRequest`
        # sees `ci / lint` as success.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Post legacy commit-status (soft-fail; informational only)
          STATE="$([ "${{ job.status }}" = "success" ] && echo success || echo failure)"
          curl -fsSL -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"ci / lint\",\"description\":\"${{ job.status }}\"}" || echo "::warning::failed to post legacy commit-status for ci / lint"

  ci-test:
    name: ci / test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxdo-dev pkg-config libayatana-appindicator3-dev
      - name: Install cargo-nextest
        # Required: ubuntu-24.04 runner images ship rustfmt but NOT nextest, so
        # `cargo nextest run` below would otherwise fail with "no such command".
        # The deleted `.github/workflows/ci.yml` performed this install; it now
        # lives here. Pinned by SHA and deliberately NOT soft-failed, so a
        # broken install fails the job instead of silently skipping tests.
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest
      - name: Build all targets
        run: cargo check --workspace --all-targets
      - name: Unit tests (nextest)
        # A missing binary is a hard failure (broken pipeline). Required gate runs
        # with --profile ci: that profile excludes a bounded, explicitly named set of
        # pre-existing failures (see .config/nextest.toml, cited in PR1033_HARDENED_FAILURES.md)
        # so new regressions still fail. Excluded tests are always executed and reported
        # by the non-gating ci-test-debt job below.
        shell: bash
        run: |
          if ! command -v cargo-nextest >/dev/null 2>&1; then
            echo "::error::cargo-nextest is not on PATH; the installation step failed"
            exit 1
          fi
          cargo nextest run --workspace --profile ci 2>&1 | tee nextest.log
      - name: Post legacy commit-status for merge gate
        # Mirror ci / lint step: publish the modern check-run result as a
        # legacy commit-status so GraphQL mergePullRequest sees ci / test.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Post legacy commit-status (soft-fail; informational only)
          STATE="$([ "${{ job.status }}" = "success" ] && echo success || echo failure)"
          curl -fsSL -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"ci / test\",\"description\":\"${{ job.status }}\"}" || echo "::warning::failed to post legacy commit-status for ci / test"

  ci-test-debt:
    name: "Debt (pre-existing failures, non-gating)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxdo-dev pkg-config libayatana-appindicator3-dev
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest
      - name: Build all targets
        run: cargo check --workspace --all-targets
      - name: Run bounded pre-existing debt tests (real status, non-gating)
        # Always-visible debt tracking for PR1033_HARDENED_FAILURES.md class-(b) failures.
        # Runs ONLY the excluded set; no continue-on-error so reported status is real.
        # Job-level if: always() keeps this visible without gating merges.
        shell: bash
        run: |
          if ! command -v cargo-nextest >/dev/null 2>&1; then
            echo "::error::cargo-nextest is not on PATH; the installation step failed"
            exit 1
          fi
          cargo nextest run --workspace -E 'test(batch_strategy_reports_contract_error) | test(fr003_healthz_readyz_split_is_observable) | test(fr003_middleware_increments_extract_counter_when_traceparent_present) | test(fr003_middleware_increments_inject_counter) | test(fr003_prometheus_handler_reads_both_counters) | test(fr003_serve_middleware_wired_in_router) | test(fr004_l81_13_man_subcommand_matches_committed_page) | test(fr004_axe_dashboard_still_passes) | test(serve_healthz_e2e_returns_200) | (package(=sharecli-ffi) & binary(=ffi_api)) | test(all_severity_variants_have_distinct_color_tokens)' 2>&1 | tee nextest-debt.log

  ci-loom:
    # Restored from the deleted `ci.yml` `loom` job (review finding P2 on
    # PR #933). `cfg(loom)` is not enabled by ordinary `cargo check` or
    # `cargo nextest` runs, so PoolIndex / RelaxedCounter concurrency models
    # receive zero coverage without this job. Not a required branch-protection
    # context, so a failure reports signal without blocking merges.
    name: ci / loom (sharecli-sync)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - name: Cargo cache
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
        with:
          shared-key: ci-loom
      - name: Loom model (PoolIndex / RelaxedCounter)
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo test --locked -p sharecli-sync --test loom_pool_index

  ci-netblock:
    # Restored from the deleted `ci.yml` `netblock` job (review finding on
    # PR #933). This is the HARD offline-build gate: it fetches the lockfile,
    # then builds with CARGO_NET_OFFLINE=1. `netblock-soft.yml` runs the same
    # script under `continue-on-error: true` and therefore cannot substitute
    # for it. Not a required branch-protection context.
    name: netblock hermetic (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Cargo cache
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
        with:
          shared-key: ci-netblock
      - name: Netblock hermetic gate
        run: bash scripts/ci/netblock_check.sh
