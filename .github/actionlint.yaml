# actionlint configuration
# https://github.com/rhysd/actionlint/blob/v1.7.12/docs/config.md
# Note: most workflows run on GitHub-hosted images, but the nightly Harbor
# soak job in `.github/workflows/soak.yml` uses a project-owned self-hosted
# runner labeled `desk-sharecli`. Declare that label here so actionlint does
# not flag `runs-on: [self-hosted, Linux, X64, desk-sharecli]` as an
# "unknown label" error on every PR.

self-hosted-runner:
  labels:
    - desk-sharecli

paths:
  # Forward reference: the `detect` job's `outputs:` block references
  # `steps.detect.outputs.*` before the step with `id: detect` is declared.
  # This is legal in GitHub Actions (step ids resolve within the whole job) and
  # the detect job is exercised on every CI run, but actionlint's static
  # analysis reports it as an undefined property. Ignore that specific message.
  .github/workflows/ci.yml:
    ignore:
      - 'property "detect" is not defined in object type'
  # Forward reference: a later step references `steps.run_soak.conclusion`
  # from a step with `id: run_soak` declared earlier in the same job.
  # actionlint cannot resolve the forward reference across the entire
  # `run:` heredoc, so it flags the property as undefined. The id is
  # correctly declared (soak.yml:77) and works at runtime; this is a
  # known false positive for the static linter.
  .github/workflows/soak.yml:
    ignore:
      - 'property "run_soak" is not defined in object type'
