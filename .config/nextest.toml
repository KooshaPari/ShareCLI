#   ffi_request_returns_null_when_socket_missing, ffi_serve_get_fetches_local_http_endpoint,
#   ffi_request_round_trips_arbitrary_json_rpc, ffi_serve_get_returns_null_for_invalid_url,
#   ffi_serve_get_returns_null_for_null_url, ffi_socket_path_honours_sharcli_ipc_sock_env_var,
