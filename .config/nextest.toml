[profile.coverage]
# Profile for coverage collection
test-threads = 1
fail-fast = false
slow-timeout = { period = "300s" }

[profile.e2e]
# Profile for E2E tests
retries = 1
test-threads = 2
fail-fast = false
slow-timeout = { period = "300s", terminate-after = 2 }

[profile.integration]
# Profile for integration tests
test-threads = 4
fail-fast = false
slow-timeout = { period = "120s" }

[execution]
timeout = { period = "60s", terminate-after = 3, grace-period = "10s" }

[runner]
test-runner = "cargo-test"

[junit]
path = "junit.xml"
report-name = "nextest"
store-success-output = true
store-failure-output = true

# Override settings for specific tests
[[profile.default.overrides]]
filter = 'test(/_integration_/)'
test-group = "serial"
slow-timeout = { period = "120s" }

[[profile.ci.overrides]]
filter = 'test(/_e2e_/)'
retries = 2
slow-timeout = { period = "300s" }

# Quarantined flakes — see docs/testing/flake-policy.md.
# Prefer #[ignore = "flake: #N"] first; use this override only when a test must
# still run in CI with extra retries while a fix is in flight.
[[profile.ci.overrides]]
filter = 'test(/_quarantine_/)'
retries = { backoff = "exponential", count = 4, delay = "1s", max-delay = "8s" }

# Platform-specific settings
[profile.ci.platform]
darwin = { test-threads = 4 }
linux = { test-threads = 8 }
windows = { test-threads = 4 }
