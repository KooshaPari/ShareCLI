# Gitleaks configuration for sharecli
# https://github.com/gitleaks/gitleaks
# Auto-generated by pheno-cli bootstrap

[allowlist]
description = "Public placeholders and examples"
# gitleaks 8.24.x renames the file-match key from `files` to `paths`;
# the old key was silently ignored, so these entries never applied.
paths = [
  "^\\.env\\.example$",
  "^\\.env\\.template$",
  "^\\.env\\.local\\.example$",
  "^docs/.*$",
  "^.*\\.md$",
  "^gitleaks\\.toml$",
  "^test.*$",
  "^.*_test\\.py$",
  "^.*_test\\.go$",
  "^tests/.*$",
]

# Allow known test/dev placeholder patterns
regexes = [
  "^agileplus-dev$",
  "^dev-secret-key-change-in-prod$",
  "^your-.+-here$",
  "^CHANGE_ME_IN_PROD$",
  "^PLACEHOLDER_",
  "^test-secret$",
  "^example-key$",
  "^dummy-token$",
  "^fake-api-key$",
]

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API Key"
regex = '''sk-or-v1-[a-f0-9]{32,}'''
tags = ["apikey", "openrouter"]
entropy = 4.5

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[a-zA-Z0-9]{48}'''
tags = ["apikey", "openai"]
entropy = 4.5

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[a-zA-Z0-9]{32,}'''
tags = ["apikey", "anthropic"]
entropy = 4.5

[[rules]]
id = "github-oauth-token"
description = "GitHub OAuth Token"
regex = '''ghp_[a-zA-Z0-9]{36,}'''
tags = ["apikey", "github"]
entropy = 4.5

[[rules]]
id = "github-fine-grained-pat"
description = "GitHub Fine-Grained PAT"
regex = '''github_pat_[a-zA-Z0-9_]{22,}'''
tags = ["apikey", "github"]
entropy = 4.5

[[rules]]
id = "github-app-token"
description = "GitHub App Token"
regex = '''ghs_[a-zA-Z0-9]{36}'''
tags = ["apikey", "github"]
entropy = 4.5

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret)[\s]*[=:]+[\s]*['"]?[a-zA-Z0-9_-]{20,}['"]?'''
tags = ["apikey", "generic"]
entropy = 4.0

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "apikey"]
entropy = 4.0

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Key"
# Require "aws" context within 24 chars before a 40-char base64 secret,
# quoted or unquoted (covers `AWS_SECRET_ACCESS_KEY="<40>"` and
# `AWS_SECRET_ACCESS_KEY = "<40>"`). A bare 40-char base64 pattern (as
# originally written) also matched npm package-lock sha512 integrity hashes
# and base64 test fixtures. The capture group also fixes gitleaks 8.24.x
# config load: "invalid regex secret group 1, max regex secret group 0".
regex = '''(?i)aws(?:.{0,24})?['"]?([0-9a-zA-Z/+]{40})['"]?'''
tags = ["aws", "secret"]
entropy = 4.5
secretGroup = 1

[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[baprs]-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*'''
tags = ["slack", "token"]
entropy = 4.0

[[rules]]
id = "slack-webhook"
description = "Slack Webhook"
regex = '''https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8}/B[a-zA-Z0-9_]{8,}/[a-zA-Z0-9_]{24}'''
tags = ["slack", "webhook"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'''
tags = ["privatekey", "crypto"]

[[rules.allowlists]]
description = "Synthetic encrypted-PEM fixture in pem_decode unit tests"
condition = "and"
regexTarget = "line"
paths = ['''src/pem_decode\.rs$''']
regexes = ['''^\s*let pem = "-----BEGIN RSA PRIVATE KEY-----''']

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[a-zA-Z0-9_-]*\.eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*'''
tags = ["jwt", "token"]
entropy = 4.0


[[rules]]
id = "database-url"
description = "Database URL with credentials"
regex = '''(?i)(postgres|mysql|mongodb)://[^:]+:[^@]+@'''
tags = ["database", "connection"]
entropy = 4.0
