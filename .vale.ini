# Inclusive-language prose lint for sharecli user-facing docs (C09 L81.10).
# Microsoft package supplies Gender/GenderBias rules; sharecli style adds ableist-term gate.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Microsoft
Vocab = sharecli

[*.md]
BasedOnStyles = Vale, Microsoft, sharecli
Vale.Terms = NO
Vale.Spelling = NO
# Inclusive-language subset only — not full Microsoft editorial style.
Microsoft.Spelling = NO
Microsoft.Terms = NO
Microsoft.Passive = NO
Microsoft.Dashes = NO
Microsoft.Contractions = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Adverbs = NO
Microsoft.Foreign = NO
Microsoft.Auto = NO
Microsoft.GeneralURL = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Wordiness = NO
Microsoft.SentenceLength = NO
Microsoft.Semicolon = NO
Microsoft.Quotes = NO
Microsoft.Hyphens = NO
Microsoft.OxfordComma = NO
Microsoft.Units = NO
Microsoft.URLFormat = NO
Microsoft.DateFormat = NO
Microsoft.DateOrder = NO
Microsoft.DateNumbers = NO
Microsoft.RangeTime = NO
Microsoft.Percentages = NO
Microsoft.Plurals = NO
Microsoft.Ordinal = NO
Microsoft.Negative = NO
Microsoft.Ellipses = NO
Microsoft.AMPM = NO
Microsoft.Acronyms = NO
Microsoft.Headings = NO
Microsoft.HeadingColons = NO
Microsoft.Spacing = NO
Microsoft.Suspended = NO
TokenIgnores = (`[^`]+`)

# Operator/ops docs are reference-heavy — spelling/terms only.
[docs/ops/**]
BasedOnStyles = Vale

# Style guide documents banned terms as negative examples.
[docs/style-guide.md]
BasedOnStyles = Vale

# Generated artifacts quote commit subjects verbatim from repository history.
# That is not authored prose and cannot be corrected without rewriting history,
# so exclude generated files from the docs policy. Hand-written docs stay fully
# gated by the rules above.
[*.gen.md]
BasedOnStyles =
