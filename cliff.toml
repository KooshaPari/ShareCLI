# Configuration for git-cliff: https://git-cliff.org/
# Generates CHANGELOG from conventional commits.
#
# Status (2026-10-17, chore/cliff-toml-ascii-20261017):
#   * ASCII section headers (was: emoji - violates AGENTS.md ASCII-only rule)
#   * Hardcoded GitHub link (was: `commit.link` - undefined in context for
#     git-cliff 2.12.0 without [remote.github] which currently hits a JSON
#     parse error on this repo)
#   * Footer drops the `{{ now }}` variable (removed in git-cliff 2.x; use
#     `git cliff --tag <tag>` to anchor the release date externally)
#   * `^Merge` / `^merge` parser rules + `filter_unconventional = false`
#     drop the 182 merge commits that previously tripped the
#     "Missing type in commit summary" parse error (now 37 grouping
#     errors, all from non-conventional historical commits).
#
# The hand-curated CHANGELOG.md (Wave/Plan structure) remains the source
# of truth for historical release notes; this config is kept functional
# for future `--unreleased` runs and CI-driven CHANGELOG previews.
#
# Status (2026-11-04, chore/changelog-gen-refresh-20261031):
#   * Commit bodies are prefixed per line with `  > ` so they stay nested
#     inside their list item instead of starting a new top-level list when
#     a body line begins with `*` (MD027). The `indent` filter cannot do
#     this on git-cliff 2.12.0: `first_line=true` is a no-op there, hence
#     `split`/`join` plus the explicit first-line prefix.
#   * `trim = false` is required for the same reason: trimming strips the
#     leading spaces of the first body line. `just changelog` therefore
#     strips trailing whitespace afterwards instead.
#   * `commit_preprocessors` normalize typographic punctuation (dashes,
#     arrows, smart quotes, ellipsis) to ASCII in the generated view only.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""

body = """
{%- for group, commits in commits | group_by(attribute="group") %}
## {{ group | upper_first }}

{%- for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/KooshaPari/ShareCLI/commit/{{ commit.id }}))
  {%- if commit.body %}
  > {{ commit.body | split(pat="\n") | join(sep="\n  > ") }}
  {%- endif %}
{%- endfor %}
{%- endfor %}
"""

footer = """
---

**Generated by:** `git cliff` (https://git-cliff.org/)
"""

trim = false

[git]
conventional_commits = true
filter_unconventional = false

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^Merge", skip = true },
  { message = "^merge", skip = true },
]

commit_filters = [{ remove_if_matches = ".*skip.*changelog.*" }]

# Normalize typographic punctuation in the generated view to ASCII. Commit
# subjects and bodies are quoted verbatim, so the only place this can be fixed
# is on the way out; git history is never rewritten.
commit_preprocessors = [
  { pattern = '\x{2013}|\x{2014}|\x{2015}', replace = "-" },
  { pattern = '\x{2018}|\x{2019}', replace = "'" },
  { pattern = '\x{201C}|\x{201D}', replace = '"' },
  { pattern = '\x{2026}', replace = "..." },
  { pattern = '\x{2190}', replace = "<-" },
  { pattern = '\x{2192}', replace = "->" },
  { pattern = '\x{2194}', replace = "<->" },
]

tag_pattern = "v[0-9].*"
skip_tags = ""
sort_commits = "newest"
