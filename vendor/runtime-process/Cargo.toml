[package]
name = "runtime-process"
version = "0.3.10"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/PhenoShared"
rust-version = "1.82"
description = "ProcessPort implementation: cross-platform managed subprocess via command-group."

[dependencies]
substrate-core = { version = "0.3.8", path = "../substrate-core" }
async-trait = "0.1"
tokio = { version = "1.42", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "process",
  "sync",
  "time",
] }
uuid = { version = "1.11", features = ["v4", "serde"] }
command-group = { version = "5.0", features = ["with-tokio"] }

[dev-dependencies]
tempfile = "3.14"
