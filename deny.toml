# cargo-deny policy (C06 L51/L55/L58). Source of truth for licenses, advisories,
# and dependency-confusion guards. Post-W5.1: crates.io-only + explicit git
# allowlist; Dependabot + deny.yml PR gate catch typosquatting on lock churn.
#
# Private-registry mirror: N/A (public crates.io workspace). Substitute registries
# are blocked via `unknown-registry = "deny"`.

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-3-Clause-Clear",
  "CC0-1.0",
  "CC-BY-SA-4.0",
  "CDDL-1.0",
  "GPL-3.0-only",
  # winfsp / winfsp-sys (Windows FUSE bindings, sharecli-fuse) declare the
  # deprecated SPDX id "GPL-3.0"; cargo-deny >= 0.18.4 matches it pedantically.
  "GPL-3.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  "WTFPL",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/KooshaPari/PhenoInfra",
  "https://github.com/KooshaPari/PhenoShared",
]

[advisories]
ignore = [
  # Marvin attack advisory covers every released version of rsa (introduced 0.0.0-0, no patch).
  # sharecli only decodes/verifies JWTs with RSA public keys for local sidecar auth (src/serve_auth.rs);
  # it never performs network-exposed RSA private-key operations.
  { id = "RUSTSEC-2023-0071", reason = "No patched rsa release exists (advisory covers all versions); JWT use is local public-key verification only." },
  # Informational 'unmaintained' advisory for paste - stale Cargo.lock entry, not in the workspace dep graph.
  { id = "RUSTSEC-2024-0436", reason = "paste is a stale Cargo.lock entry; cargo tree -i paste is empty, nothing to replace." },
  # proc-macro-error pulled in by tray-icon's Linux gtk backend (via tao/muda
  # gtk deps). Linux-only, not compiled for the Windows tray artifact; no safe
  # upgrade in the 1.x line.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained - transitive via tray-icon Linux gtk backend only; not compiled for Windows tray." },
  # Informational 'unmaintained' for unsafe-libyaml (RUSTSEC-2024-0449):
  # unsafe-libyaml is a transitive dep of serde_yaml which is used in one
  # Cargo config helper; dtolnay archived the repo. No safe upgrade path
  # without a serde_yaml -> serde_yml migration. Tracked as a follow-up;
  # ignoreUntil 2026-11-15 forces a 30-day re-triage window.
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained - dtolnay archived the repo, no patched release. Follow-up: migrate serde_yaml -> serde_yml. Re-triage by 2026-11-15." },
  # zvariant / zbus_names / zvariant_derive 'informational unmaintained'
  # advisories (RUSTSEC-2026-0370 / -0371 / -0372). All three crates were
  # merged into zbus 6.0.0; tray-icon 0.25.x pins zbus 5.x, so a fixable
  # upgrade requires bumping tray-icon to a release that accepts zbus 6.x.
  # Linux-only (libappindicator tray backend). Tracked as a follow-up; same
  # 30-day exception pattern as RUSTSEC-2024-0449.
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained - merged into zbus 6.0.0. tray-icon 0.25.x pins zbus 5.x. Follow-up: bump tray-icon. Re-triage by 2026-11-15." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained - merged into zbus 6.0.0. tray-icon 0.25.x pins zbus 5.x. Follow-up: bump tray-icon. Re-triage by 2026-11-15." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained - merged into zbus 6.0.0. tray-icon 0.25.x pins zbus 5.x. Follow-up: bump tray-icon. Re-triage by 2026-11-15." },
]
