# cargo-deny policy (C06 L51/L55/L58). Source of truth for licenses, advisories,
# and dependency-confusion guards. Post-W5.1: crates.io-only + explicit git
# allowlist; Dependabot + deny.yml PR gate catch typosquatting on lock churn.
#
# Private-registry mirror: N/A (public crates.io workspace). Substitute registries
# are blocked via `unknown-registry = "deny"`.

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-3-Clause-Clear",
  "CC0-1.0",
  "CC-BY-SA-4.0",
  "CDDL-1.0",
  "GPL-3.0-only",
  # winfsp / winfsp-sys (Windows FUSE bindings, sharecli-fuse) declare the
  # deprecated SPDX id "GPL-3.0"; cargo-deny >= 0.18.4 matches it pedantically.
  "GPL-3.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  "WTFPL",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/KooshaPari/PhenoShared",
  "https://github.com/KooshaPari/PhenoInfra.git",
]

[advisories]
ignore = [
  # No safe upgrade available - rustls-pemfile deprecated, migration requires async-nats update
  { id = "RUSTSEC-2025-0134", reason = "No safe upgrade available. rustls-pemfile deprecated, migration requires async-nats update." },
  # No safe upgrade available - gix = "0.71" pinned in Cargo.toml, requires major version bump
  { id = "RUSTSEC-2025-0140", reason = "No safe upgrade available. gix = 0.71 pinned in Cargo.toml, requires breaking API change." },
  # Marvin attack advisory covers every released version of rsa (introduced 0.0.0-0, no patch).
  # sharecli only decodes/verifies JWTs with RSA public keys for local sidecar auth (src/serve_auth.rs);
  # it never performs network-exposed RSA private-key operations.
  { id = "RUSTSEC-2023-0071", reason = "No patched rsa release exists (advisory covers all versions); JWT use is local public-key verification only." },
  # Informational 'unmaintained' advisory for paste - stale Cargo.lock entry, not in the workspace dep graph.
  { id = "RUSTSEC-2024-0436", reason = "paste is a stale Cargo.lock entry; cargo tree -i paste is empty, nothing to replace." },
  # gtk-rs 0.18 GTK3 bindings are Linux-only transitive deps of tray-icon's gtk
  # backend. They never compile or ship into the Windows tray artifact
  # (sharecli ships a separate native Linux tray via ksni). Unmaintained per
  # RUSTSEC-2024-0412/0413/0415/0416/0418/0419/0420.
  { id = "RUSTSEC-2024-0412", reason = "gtk-rs GTK3 unmaintained - Linux-only dep of tray-icon gtk backend for Windows tray; dead code on our target." },
  { id = "RUSTSEC-2024-0413", reason = "gtk-rs GTK3 unmaintained - Linux-only dep of tray-icon gtk backend; not compiled for Windows tray." },
  { id = "RUSTSEC-2024-0415", reason = "gtk-rs GTK3 unmaintained - Linux-only dep of tray-icon gtk backend; not compiled for Windows tray." },
  { id = "RUSTSEC-2024-0416", reason = "gtk-rs GTK3 unmaintained - Linux-only dep of tray-icon gtk backend; not compiled for Windows tray." },
  { id = "RUSTSEC-2024-0418", reason = "gtk-rs GTK3 unmaintained - Linux-only dep of tray-icon gtk backend; not compiled for Windows tray." },
  { id = "RUSTSEC-2024-0419", reason = "gtk-rs GTK3 unmaintained - Linux-only dep of tray-icon gtk backend; not compiled for Windows tray." },
  { id = "RUSTSEC-2024-0420", reason = "gtk-rs GTK3 unmaintained - Linux-only dep of tray-icon gtk backend; not compiled for Windows tray." },
  # proc-macro-error pulled in by tray-icon's libappindicator backend:
  # sharecli-tray-windows -> tray-icon -> libappindicator -> gtk -> atk -> glib
  # -> glib-macros -> proc-macro-error. Build-time only macro crate; no
  # runtime impact. 1.0.4 is the last released version; no patched release
  # exists in the proc-macro-error 1.x line. The path is Linux-only: tray-icon
  # gates its `libappindicator` dep behind
  # cfg(any(target_os = "linux", dragonfly, freebsd, netbsd, openbsd)), so
  # `cargo tree -i proc-macro-error --target x86_64-pc-windows-msvc` and
  # `--target aarch64-apple-darwin` both print nothing.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 unmaintained. Build-time macro transitive of sharecli-tray-windows via tray-icon's libappindicator backend; Linux-only because tray-icon gates libappindicator behind cfg(any(target_os = \"linux\", dragonfly, freebsd, netbsd, openbsd)). No patched release; build-time-only." },
  # zbus family (zvariant / zbus_names / zvariant_derive) — Linux-only transitive
  # deps of sharecli-tray-linux's ksni-based StatusNotifierItem client. zbus 5.x
  # still re-exports the pre-merge crate names for source compat, but RustSec
  # has flagged each as unmaintained now that they are folded into the
  # monolithic `zbus` 6.x. sharecli does not use these crates directly; ksni
  # pulls them in only when sharecli-tray-linux is built, and that crate is
  # cfg(target_os = "linux")-gated.
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (folded into zbus 6.0.0 as zbus::wire); Linux-only transitive of sharecli-tray-linux via ksni/zbus. cfg(target_os = \"linux\")-gated; not compiled into Windows/macOS sharecli artifacts." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (folded into zbus 6.0.0 as zbus::names); Linux-only transitive of sharecli-tray-linux via ksni/zbus. cfg(target_os = \"linux\")-gated; not compiled into Windows/macOS sharecli artifacts." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (folded into zbus 6.0.0 derive macros); Linux-only transitive of sharecli-tray-linux via ksni/zbus. cfg(target_os = \"linux\")-gated; not compiled into Windows/macOS sharecli artifacts." },
  # glib 0.18.x (RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g alias) — RUSTSEC-2024-0429
  # is an "unsound" advisory for glib::VariantStrIter's Iterator/DoubleEndedIterator
  # impls (not an "unmaintained" one). The patched 0.20.0 release is a breaking
  # change gtk 0.18.2 does not accept, so there is no non-breaking upgrade path.
  # Reachable only on Linux: tray-icon's `libappindicator` feature pulls
  # libappindicator/gtk, and tray-icon gates that dep behind
  # cfg(any(target_os = "linux", dragonfly, freebsd, netbsd, openbsd)), so
  # `cargo tree -i glib --target x86_64-pc-windows-msvc` and
  # `--target aarch64-apple-darwin` both print nothing. The Rust
  # sharecli-tray-windows crate is a dev-dependency of `sharecli` and is never
  # built by any CI or release workflow (the Windows tray ships as a C#/MSBuild
  # WinUI app from windows/ShareCLITray). Listed for OSV/CI parity; cargo-deny
  # considers 0.18.5 patched so the advisory-not-detected warning is expected.
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 unsound glib::VariantStrIter Iterator/DoubleEndedIterator impls (informational=unsound). Linux-only: reached via sharecli-tray-windows -> tray-icon(libappindicator) -> libappindicator -> gtk -> atk -> glib, and tray-icon gates libappindicator behind cfg(any(target_os = \"linux\", dragonfly, freebsd, netbsd, openbsd)). Patched 0.20.0 is a breaking release gtk 0.18.2 cannot accept; no non-breaking upgrade." },
  # unsafe-libyaml was archived 2024-03-25 by its owner and is read-only.
  # The last release is 0.2.11; no safe upgrade exists. It is transitively
  # pulled in by serde_yaml 0.9.34+deprecated (itself deprecated). sharecli
  # uses serde_yaml only for parsing local config/auth files - never on
  # untrusted network input - so a frozen C-to-Rust translation does not
  # materially raise risk for our usage. A future migration to
  # serde_yaml_ng or toml/yaml alternatives is tracked separately.
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml archived 2024-03-25; no safe upgrade. Transitive via serde_yaml 0.9.34+deprecated; sharecli only parses local config files - never untrusted network input." },
]
