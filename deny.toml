# cargo-deny policy (C06 L51/L55/L58). Source of truth for licenses, advisories,
# and dependency-confusion guards. Post-W5.1: crates.io-only + explicit git
# allowlist; Dependabot + deny.yml PR gate catch typosquatting on lock churn.
#
# Private-registry mirror: N/A (public crates.io workspace). Substitute registries
# are blocked via `unknown-registry = "deny"`.

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-3-Clause-Clear",
  "CC0-1.0",
  "CC-BY-SA-4.0",
  "CDDL-1.0",
  "GPL-3.0-only",
  # winfsp / winfsp-sys (Windows FUSE bindings, sharecli-fuse) declare the
  # deprecated SPDX id "GPL-3.0"; cargo-deny >= 0.18.4 matches it pedantically.
  "GPL-3.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  "WTFPL",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/KooshaPari/PhenoShared",
  "https://github.com/KooshaPari/PhenoInfra.git",
]

[advisories]
ignore = [
  # Marvin attack advisory covers every released version of rsa (introduced 0.0.0-0, no patch).
  # sharecli only decodes/verifies JWTs with RSA public keys for local sidecar auth (src/serve_auth.rs);
  # it never performs network-exposed RSA private-key operations.
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin-attack advisory covers every released version (introduced 0.0.0-0, no patched release). sharecli only decodes/verifies JWTs with RSA public keys for local sidecar auth (src/serve_auth.rs); it never performs network-exposed RSA private-key operations, which the advisory names as the unsafe setting." },
  # Informational 'unmaintained' advisory for paste - stale Cargo.lock entry, not in the workspace dep graph.
  { id = "RUSTSEC-2024-0436", reason = "Informational 'unmaintained' advisory for the paste crate. paste 1.0.15 is a stale Cargo.lock entry: no package in the workspace dependency graph references it (cargo tree -i paste is empty), so there is nothing to replace." },
  # proc-macro-error pulled in by tray-icon's libappindicator backend:
  # sharecli-tray-windows -> tray-icon -> libappindicator -> gtk -> atk -> glib
  # -> glib-macros -> proc-macro-error. Build-time only macro crate; no
  # runtime impact. 1.0.4 is the last released version; no patched release
  # exists in the proc-macro-error 1.x line. The path is Linux/BSD: tray-icon
  # gates its `libappindicator` dep behind
  # cfg(any(target_os = "linux", dragonfly, freebsd, netbsd, openbsd)), so
  # `cargo tree -i proc-macro-error --target x86_64-pc-windows-msvc` and
  # `--target aarch64-apple-darwin` both print nothing.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 unmaintained. Build-time macro transitive of sharecli-tray-windows via tray-icon's libappindicator backend; Linux/BSD because tray-icon gates libappindicator behind cfg(any(target_os = \"linux\", dragonfly, freebsd, netbsd, openbsd)). No patched release; build-time-only, no runtime impact on sharecli artifacts." },
  # zbus family (zvariant / zbus_names / zvariant_derive) - two independent
  # paths reach zbus, and neither one is compiled into a macOS or Windows
  # sharecli artifact:
  #   (a) sharecli-tray-linux -> ksni -> zbus.
  #       crates/sharecli-tray-linux/Cargo.toml declares ksni under
  #       [target.'cfg(target_os = "linux")'.dependencies], so this path is
  #       Linux-only, and it is absent on FreeBSD.
  #   (b) sharecli feature "desktop-notifications" -> notify-rust 4.18.2 ->
  #       zbus. notify-rust 4.18.2 declares zbus under
  #       [target.'cfg(all(unix, not(target_os = "macos")))'.dependencies],
  #       which covers Linux, FreeBSD and the other BSDs and excludes macOS.
  #       On FreeBSD this is the only path to zbus.
  # zbus 5.x still re-exports the pre-merge crate names for source compat, but
  # RustSec has flagged each as unmaintained now that they are folded into the
  # monolithic `zbus` 6.x. All three are informational=unmaintained with
  # patched = [], so there is no patched release to upgrade to. sharecli does
  # not use these crates directly.
  # The advisories still fire because neither scanner resolves per-target:
  # osv.yml and ci.yml both pass --lockfile=Cargo.lock, and deny.yml runs bare
  # `cargo deny check` with no [graph] target filter in deny.toml. Both read
  # the target-agnostic root Cargo.lock, which lists zvariant, zbus_names and
  # zvariant_derive regardless of the build target.
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (folded into zbus 6.0.0 as zbus::wire); Two independent zbus paths reach it: (a) sharecli-tray-linux -> ksni -> zbus, gated by cfg(target_os = \"linux\") in crates/sharecli-tray-linux/Cargo.toml (Linux only, and absent on FreeBSD); (b) sharecli feature \"desktop-notifications\" -> notify-rust 4.18.2 -> zbus, gated by notify-rust's cfg(all(unix, not(target_os = \"macos\"))) target dep table, which covers Linux, FreeBSD and the other BSDs and excludes macOS - on FreeBSD notify-rust is the only path to zbus. macOS and Windows artifacts do not link zbus (cargo tree -i zbus --target aarch64-apple-darwin prints nothing). The advisory is still reported because both scanners read only the target-agnostic root Cargo.lock (osv.yml and ci.yml pass --lockfile=Cargo.lock; deny.yml runs bare cargo deny check and deny.toml has no [graph] target filter), which lists zvariant/zbus_names/zvariant_derive regardless of build target - neither scanner does per-target resolution. It is informational=unmaintained with patched = [], so no patched release exists to upgrade to." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (folded into zbus 6.0.0 as zbus::names); Two independent zbus paths reach it: (a) sharecli-tray-linux -> ksni -> zbus, gated by cfg(target_os = \"linux\") in crates/sharecli-tray-linux/Cargo.toml (Linux only, and absent on FreeBSD); (b) sharecli feature \"desktop-notifications\" -> notify-rust 4.18.2 -> zbus, gated by notify-rust's cfg(all(unix, not(target_os = \"macos\"))) target dep table, which covers Linux, FreeBSD and the other BSDs and excludes macOS - on FreeBSD notify-rust is the only path to zbus. macOS and Windows artifacts do not link zbus (cargo tree -i zbus --target aarch64-apple-darwin prints nothing). The advisory is still reported because both scanners read only the target-agnostic root Cargo.lock (osv.yml and ci.yml pass --lockfile=Cargo.lock; deny.yml runs bare cargo deny check and deny.toml has no [graph] target filter), which lists zvariant/zbus_names/zvariant_derive regardless of build target - neither scanner does per-target resolution. It is informational=unmaintained with patched = [], so no patched release exists to upgrade to." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (folded into zbus 6.0.0 derive macros); Two independent zbus paths reach it: (a) sharecli-tray-linux -> ksni -> zbus, gated by cfg(target_os = \"linux\") in crates/sharecli-tray-linux/Cargo.toml (Linux only, and absent on FreeBSD); (b) sharecli feature \"desktop-notifications\" -> notify-rust 4.18.2 -> zbus, gated by notify-rust's cfg(all(unix, not(target_os = \"macos\"))) target dep table, which covers Linux, FreeBSD and the other BSDs and excludes macOS - on FreeBSD notify-rust is the only path to zbus. macOS and Windows artifacts do not link zbus (cargo tree -i zbus --target aarch64-apple-darwin prints nothing). The advisory is still reported because both scanners read only the target-agnostic root Cargo.lock (osv.yml and ci.yml pass --lockfile=Cargo.lock; deny.yml runs bare cargo deny check and deny.toml has no [graph] target filter), which lists zvariant/zbus_names/zvariant_derive regardless of build target - neither scanner does per-target resolution. It is informational=unmaintained with patched = [], so no patched release exists to upgrade to." },
  # glib 0.18.x (RUSTSEC-2024-0429, also published as the GHSA-wrw7-89jp-8q8g
  # alias) - RUSTSEC-2024-0429
  # is an "unsound" advisory for glib::VariantStrIter's Iterator/DoubleEndedIterator
  # impls (not an "unmaintained" one). The patched 0.20.0 release is a breaking
  # change gtk 0.18.2 does not accept, so there is no non-breaking upgrade path.
  # Reachable only on Linux: tray-icon's `libappindicator` feature pulls
  # libappindicator/gtk, and tray-icon gates that dep behind
  # cfg(any(target_os = "linux", dragonfly, freebsd, netbsd, openbsd)), so
  # `cargo tree -i glib --target x86_64-pc-windows-msvc` and
  # `--target aarch64-apple-darwin` both print nothing. The Rust
  # sharecli-tray-windows crate is a dev-dependency of `sharecli` and IS
  # compiled by Linux CI (`cargo tree -i glib-sys --target
  # x86_64-unknown-linux-gnu -e normal,dev` resolves glib-sys through it), but
  # it is not linked into any shipped artifact: release.yml builds only
  # `--bin sharecli`, `-p sharecli-tray-linux` and `-p sharecli-ffi`, and the
  # Windows tray ships as a C#/MSBuild WinUI app from windows/ShareCLITray.
  # Listed for OSV/CI parity. cargo-deny does NOT report this advisory even
  # though glib 0.18.5 is unpatched (the advisory's [versions] patched range is
  # ">=0.20.0"): the advisory is scoped by [affected.functions] to the
  # glib::VariantStrIter Iterator/DoubleEndedIterator impls, and cargo-deny
  # cannot prove those specific functions are called, so it emits
  # warning[advisory-not-detected] for this entry. osv-scanner matches on the
  # version range alone and does report it, which is why the osv-scanner.toml
  # mirror is load-bearing and this one is not.
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 unsound glib::VariantStrIter Iterator/DoubleEndedIterator impls (informational=unsound). Linux/BSD: reached via sharecli-tray-windows -> tray-icon(libappindicator) -> libappindicator -> gtk -> atk -> glib, and tray-icon gates libappindicator behind cfg(any(target_os = \"linux\", dragonfly, freebsd, netbsd, openbsd)). Patched 0.20.0 is a breaking release gtk 0.18.2 cannot accept; no non-breaking upgrade. cargo-deny scopes this advisory by [affected.functions] to the glib::VariantStrIter Iterator/DoubleEndedIterator impls and cannot prove they are called, so it does not report it (not even under unsound = \"all\"); osv-scanner matches on version range alone and does report it, which is why the osv-scanner.toml entry is load-bearing and the deny.toml mirror is not." },
  # unsafe-libyaml was archived 2024-03-25 by its owner and is read-only.
  # The last release is 0.2.11; no safe upgrade exists. It is transitively
  # pulled in by serde_yaml 0.9.34+deprecated (itself deprecated). sharecli
  # uses serde_yaml only for parsing local config/auth files - never on
  # untrusted network input - so a frozen C-to-Rust translation does not
  # materially raise risk for our usage. A future migration to
  # serde_yaml_ng or toml/yaml alternatives is tracked separately.
  { id = "RUSTSEC-2024-0449", reason = "INFO unmaintained advisory for unsafe-libyaml, the C-based YAML backend pulled in only via serde_yaml. No patched release exists (dtolnay/unsafe-libyaml archived 2024-03-25, last release 0.2.11), so there is no version to bump to. Replacing the serde_yaml dependency chain is tracked as a follow-up issue; this exception expires in 30 days to force re-triage. cargo-deny 0.20.2 accepts only id and reason in its ignore schema, so the 30-day expiry is enforced on the osv-scanner side only (ignoreUntil = 2026-11-15)." },
  # crypto-bigint 0.5.5 - constant-time timing variability. No fix is
  # reachable: the fix needs elliptic-curve 0.14 / ecdsa 0.17 / p256 0.14,
  # and jsonwebtoken 11.1.0 (newest release) pins p256 ^0.13.2. The upstream
  # coordinated RustCrypto bump (Keats/jsonwebtoken#536) is open and unmerged.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 constant-time timing-variability advisory (RUSTSEC-2026-0387, published 2026-10-23). Several operations intended to be constant-time could execute secret-dependent branches (subtraction, zero counting, division, Montgomery multiplication, UintRef equality, BoxedMontyForm::invert). No fix is reachable: crypto-bigint 0.7.6+ requires elliptic-curve 0.14, which requires ecdsa 0.17, which requires p256/p384 0.14, and jsonwebtoken 11.1.0 (the newest release) pins p256 ^0.13.2 and p384 ^0.13.0. The upstream coordinated RustCrypto bump (Keats/jsonwebtoken#536, open and unmerged as of 2026-10-27) is what would move jsonwebtoken to the p256 0.14 / ed25519-dalek 3 generation, so no fixed jsonwebtoken release exists yet. sharecli reaches crypto-bigint only through that chain: jsonwebtoken 11.1.0 -> ecdsa 0.16.9 -> elliptic-curve 0.13.8 -> crypto-bigint 0.5.5, and uses it for ES256/ES384 ECDSA public-key decoding and signature verification in local sidecar auth (src/serve_auth.rs). The advisory names secret-dependent branches in arithmetic on secret integers; sharecli verifies ECDSA signatures over attacker-supplied tokens with a public key, so the secret-dependent values are the issuer's private key, which never enters this process, and the operations involved are signature verification rather than signing. This exception is time-bounded and expires in 30 days to force re-triage when the upstream jsonwebtoken release lands." },
]
