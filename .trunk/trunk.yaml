# =============================================================================
# Trunk.io — Plugin versions for linting/formatting tools
# =============================================================================
# Migrated to v0.1 schema (legacy `linters`/`formatters`/`actions`/`cache`/`env`
# keys were rejected by Trunk CLI >= 1.22.x). See
# https://docs.trunk.io/check/reference for the canonical schema.
# =============================================================================

version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      ref: v1.2.2
      uri: https://github.com/trunk-io/plugins

# -----------------------------------------------------------------------------
# Linters (auto-detected by file type)
# -----------------------------------------------------------------------------
lint:
  enabled:
    - actionlint
    - black
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - ruff
    - shellcheck
    - taplo
    - yamllint
  definitions:
    - name: actionlint
      direct_configs:
        - .github/workflows/*.yml
    - name: black
      commands:
        - name: lint
          run: black --check --line-length 100 ${target}
          output: regex
          parse_regex: '(?P<path>.*?):(?P<line>\d+):\s*(?P<message>.*)'
          success_codes: [0, 1]
          read_output_from: stdout
      direct_configs:
        - pyproject.toml
        - ruff.toml
    - name: clippy
      commands:
        - name: lint
          run: cargo clippy --all-targets --all-features -- -D warnings
          output: regex
          parse_regex: '(?P<path>.*?):(?P<line>\d+):(?P<col>\d+):\s*(?P<severity>\w+):\s*(?P<message>.*)'
          success_codes: [0, 1]
          read_output_from: stdout
    - name: eslint
      direct_configs:
        - .eslintrc.*
        - eslint.config.*
    - name: mypy
      commands:
        - name: lint
          run: mypy --ignore-missing-imports ${target}
          output: regex
          parse_regex: '(?P<path>.*?):(?P<line>\d+):(?P<col>\d+):\s*(?P<severity>\w+):\s*(?P<message>.*)'
          success_codes: [0, 1]
          read_output_from: stdout
    - name: ruff
      commands:
        - name: lint
          run: ruff check --output-format=github ${target}
          output: regex
          parse_regex: '::(?P<severity>.*?) (?P<code>.*?)::(?P<path>.*?):(?P<line>\d+):(?P<col>\d+):(?P<message>.*)'
          success_codes: [0, 1]
          read_output_from: stdout
      direct_configs:
        - ruff.toml
        - pyproject.toml

# -----------------------------------------------------------------------------
# Runtimes (optional — trunk auto-installs required runtimes for each lint;
# pinning versions here forces a specific install which can fail if the
# version is not available for the runner's OS/CPU. Default is recommended.)
# -----------------------------------------------------------------------------
# runtimes:
#   enabled:
#     - node
#     - python
#     - go

# -----------------------------------------------------------------------------
# Formatters (v0.1 uses lint.definitions[] with success_codes for formatters
# too; runtime `trunk fmt` discovers them automatically.)
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Actions (CI optimization — these are now CLI flags, not config keys)
# trunk-check is invoked by trunk-action at the configured size/memory/disk
# in the workflow file.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Merge gate (used by `trunk-merge` action)
# -----------------------------------------------------------------------------
merge:
  required_statuses:
    - "build"
    - "Lint & Format"
